  <title>Aion 2 — Portail Communautaire & Guides Francophones</title>
  <meta name="description" content="Base de connaissances, guides, builds, actualités et codes pour Aion 2. Fansite communautaire francophone." />

  <style>
    :root {
      --bg-main: #070b16;
      --bg-card: rgba(15, 23, 42, 0.85);
      --border-card: rgba(0, 242, 254, 0.25);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-gold: #ffb74d;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    /* Défilement fluide */
    html {
      scroll-behavior: smooth;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #070b16;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Aion 2 */
    .aion-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background: linear-gradient(180deg, rgba(7, 11, 22, 0.95) 0%, rgba(7, 11, 22, 0.7) 100%);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0 4%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    
    .aion-logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      height: 100%;
      position: relative;
      width: 120px;
    }
    
    .aion-logo-img {
      height: 100px;
      width: auto;
      object-fit: contain;
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      transition: transform 0.3s ease;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.9));
      z-index: 10;
    }
    
    .aion-logo-img:hover {
      transform: translateY(-50%) scale(1.05);
    }
    
    .aion-menu { 
      display: flex; 
      gap: 18px; 
      list-style: none; 
      margin-left: auto;
      align-items: center;
    }
    .aion-menu a {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: 0.2s;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .aion-menu a:hover { color: var(--accent-cyan); }
