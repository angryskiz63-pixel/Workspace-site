<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi de Commande - Skiztech</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f4f9; color: #333; line-height: 1.6; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        
        .order-card { background: #fff; border-radius: 8px; border: 1px solid #ddd; padding: 20px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .order-header { display: flex; justify-content: space-between; border-bottom: 2px solid #00bcd4; padding-bottom: 10px; margin-bottom: 15px; }
        .order-title { font-size: 1.2em; font-weight: bold; }
        .order-status { background: #e0f7fa; color: #00838f; padding: 4px 12px; border-radius: 20px; font-size: 0.85em; font-weight: bold; }
        
        .order-items { list-style: none; padding: 0; margin: 0 0 15px 0; }
        .order-items li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #eee; }
        
        .order-comment { background: #fff9c4; border-left: 4px solid #fbc02d; padding: 10px 15px; font-style: italic; border-radius: 4px; margin-top: 15px; font-size: 0.95em; }
        .order-total { text-align: right; font-size: 1.2em; font-weight: bold; color: #00bcd4; margin-top: 10px; }
        .empty-orders { text-align: center; color: #777; font-style: italic; padding: 40px 0; }
    </style>
</head>
<body>

    <header></header>

    <div class="container">
        <h1><i class="fas fa-box"></i> Vos Commandes</h1>
        <div id="orders-container"></div>
    </div>

    <script src="navbar.js"></script>

    <script>
        function afficherCommandes() {
            const container = document.getElementById('orders-container');
            const commandes = JSON.parse(localStorage.getItem('skiztech_orders')) || [];

            if (commandes.length === 0) {
                container.innerHTML = '<div class="empty-orders">Vous n\'avez aucune commande enregistrée.</div>';
                return;
            }

            container.innerHTML = '';
            commandes.forEach(cmd => {
                let itemsHtml = '';
                cmd.items.forEach(item => {
                    itemsHtml += `<li><span>${item.title || item.name}</span> <span>${(parseFloat(item.price) || 0).toFixed(2)} &euro;</span></li>`;
                });

                const card = document.createElement('div');
                card.className = 'order-card';
                card.innerHTML = `
                    <div class="order-header">
                        <span class="order-title">Commande N° ${cmd.id} — <small style="color: #666; font-weight: normal;">${cmd.date}</small></span>
                        <span class="order-status">${cmd.status}</span>
                    </div>
                    <ul class="order-items">${itemsHtml}</ul>
                    <div class="order-comment">
                        <i class="fas fa-comment"></i> <strong>Commentaire :</strong> ${cmd.comment}
                    </div>
                    <div class="order-total">Total payé : ${cmd.total} &euro;</div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = afficherCommandes;
    </script>
</body>
</html>
