<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil - Skiztech</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f4f9; color: #333; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }
        
        .hero-banner { 
            width: 100%; height: 200px; overflow: hidden; background-color: #000; 
            box-shadow: inset 0 -20px 30px rgba(0,0,0,0.5); 
        }
        .hero-banner img { width: 100%; height: 100%; object-fit: cover; object-position: center; }

        /* Card Profil */
        .profile-card { background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; margin: 40px 0; }
        .profile-header { background: #1a1a1a; padding: 40px 20px; text-align: center; color: #fff; position: relative; }
        .profile-avatar { width: 110px; height: 110px; border-radius: 50%; border: 4px solid #00bcd4; object-fit: cover; margin-bottom: 15px; }
        .profile-name { font-size: 1.8em; margin: 0; font-weight: 700; }
        .profile-badge-provider { color: #00bcd4; font-size: 0.9em; font-weight: 600; margin-top: 5px; display: inline-flex; align-items: center; gap: 6px; }

        .profile-body { padding: 30px; }
        .section-title { font-size: 1.2em; border-bottom: 2px solid #00bcd4; padding-bottom: 8px; margin-bottom: 20px; color: #1a1a1a; display: flex; align-items: center; gap: 10px; }
        .info-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #eee; }
        .info-label { font-weight: 600; color: #555; display: flex; align-items: center; gap: 10px; }
        .info-label i { color: #00bcd4; width: 20px; text-align: center; }
        .info-value { font-weight: 500; }

        /* Badges de statut */
        .badge-discount { background-color: #e0f7fa; color: #00838f; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.85em; border: 1px solid #b2ebf2; }
        .badge-nodiscount { background-color: #f5f5f5; color: #777; padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 0.85em; border: 1px solid #ddd; }

        /* Formulaire d'adresse */
        .address-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        .form-group label { font-size: 0.9em; font-weight: 600; margin-bottom: 5px; color: #444; }
        .form-group input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95em; }
        .form-group input:focus { border-color: #00bcd4; outline: none; }
        
        .btn-save { background-color: #00bcd4; color: #fff; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 15px; grid-column: span 2; }
        .btn-save:hover { background-color: #0097a7; }

        /* Footer & Réseaux Sociaux */
        footer { background-color: #1a1a1a; color: #fff; text-align: center; padding: 40px 20px; margin-top: 60px; }
        .social-links { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .social-links a { color: #fff; font-size: 1.5em; transition: color 0.2s; }
        .social-links a:hover { color: #00bcd4; }
        .footer-bottom { margin-top: 20px; padding-top: 20px; border-top: 1px solid #333; font-size: 0.9em; color: #aaa; }
        .footer-bottom span { color: #00bcd4; font-weight: bold; }

        @media (max-width: 600px) {
            .address-form { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
            .btn-save { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <section class="hero-banner">
        <img src="../images/banner-montage.png" alt="Bannière Skiztech">
    </section>

    <!-- Navigation unifiée -->
    <header></header>

    <div class="container">
        <div class="profile-card">
            <div class="profile-header">
                <img src="https://via.placeholder.com/110" id="user-avatar" class="profile-avatar" alt="Avatar Utilisateur">
                <h1 id="user-name" class="profile-name">Chargement...</h1>
                <div id="provider-badge" class="profile-badge-provider"><i class="fas fa-user"></i> Compte Membre</div>
            </div>

            <div class="profile-body">
                <div class="section-title"><i class="fas fa-user-circle"></i> Informations du compte</div>
                
                <div class="info-row">
                    <span class="info-label"><i class="fas fa-envelope"></i> Adresse Email</span>
                    <span id="user-email" class="info-value">Non renseignée</span>
                </div>

                <div class="info-row">
                    <span class="info-label"><i class="fas fa-tags"></i> Remise fidélité</span>
                    <span id="user-discount" class="info-value">
                        <span class="badge-nodiscount">Pas de réduction</span>
                    </span>
                </div>

                <div class="info-row">
                    <span class="info-label"><i class="fas fa-id-badge"></i> Identifiant Unique</span>
                    <span id="user-id" class="info-value">#---</span>
                </div>

                <!-- Formulaire d'Adresse (Ancre ajoutée id="adresse") -->
                <div id="adresse" class="section-title" style="margin-top: 30px;"><i class="fas fa-map-marker-alt"></i> Adresse de Livraison</div>
                
                <form id="address-form" class="address-form" onsubmit="sauvegarderAdresse(event)">
                    <div class="form-group">
                        <label for="address-lastname">Nom</label>
                        <input type="text" id="address-lastname" placeholder="Dupont" required>
                    </div>
                    <div class="form-group">
                        <label for="address-firstname">Prénom</label>
                        <input type="text" id="address-firstname" placeholder="Jean" required>
                    </div>
                    <div class="form-group full-width">
                        <label for="address-phone">Téléphone</label>
                        <input type="tel" id="address-phone" placeholder="06 00 00 00 00" required>
                    </div>
                    <div class="form-group full-width">
                        <label for="address-street">Adresse</label>
                        <input type="text" id="address-street" placeholder="123 Rue de la République" required>
                    </div>
                    <div class="form-group">
                        <label for="address-zip">Code Postal</label>
                        <input type="text" id="address-zip" placeholder="75000" required>
                    </div>
                    <div class="form-group">
                        <label for="address-city">Ville</label>
                        <input type="text" id="address-city" placeholder="Paris" required>
                    </div>

                    <button type="submit" class="btn-save"><i class="fas fa-save"></i> Enregistrer mes coordonnées</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer avec Réseaux Sociaux -->
    <footer id="contact">
        <div class="container">
            <div class="social-links">
                <a href="#" target="_blank" title="Twitch"><i class="fab fa-twitch"></i></a>
                <a href="#" target="_blank" title="Discord"><i class="fab fa-discord"></i></a>
                <a href="#" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
                <a href="#" target="_blank" title="Twitter / X"><i class="fab fa-x-twitter"></i></a>
                <a href="#" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
            </div>
            <div class="footer-bottom">
                Skiztech by <span>Skizcorp</span> &copy; 2026 — Tous droits réservés
            </div>
        </div>
    </footer>

    <!-- Script Navigation -->
    <script src="navbar.js"></script>

    <script>
        let currentAccountKey = null;

        function chargerProfil() {
            const authUser = JSON.parse(localStorage.getItem('auth_user'));
            const twitchUser = JSON.parse(localStorage.getItem('twitch_user'));
            const googleUser = JSON.parse(localStorage.getItem('google_user'));
            const discordUser = JSON.parse(localStorage.getItem('discord_user'));
            const genericUser = JSON.parse(localStorage.getItem('user_account'));

            let user = authUser || twitchUser || googleUser || discordUser || genericUser;
            let provider = "";
            let providerIcon = "";

            if (!user) {
                window.location.href = "index.html#auth-box";
                return;
            }

            provider = user.provider || (twitchUser ? 'twitch' : googleUser ? 'google' : discordUser ? 'discord' : 'standard');

            if (provider === 'twitch') {
                providerIcon = `<i class="fab fa-twitch" style="color:#9146FF;"></i> Membre Twitch`;
            } else if (provider === 'google') {
                providerIcon = `<i class="fab fa-google" style="color:#EA4335;"></i> Membre Google`;
            } else if (provider === 'discord') {
                providerIcon = `<i class="fab fa-discord" style="color:#5865F2;"></i> Membre Discord`;
            } else {
                providerIcon = `<i class="fas fa-user-circle"></i> Compte Skiztech`;
            }

            const rawId = user.id || user.sub || user.email || "0000";
            currentAccountKey = `${provider}_${rawId}`;

            document.getElementById('user-name').innerText = user.display_name || user.name || user.username || "Utilisateur";
            document.getElementById('user-avatar').src = user.profile_image_url || user.picture || user.avatar || "https://via.placeholder.com/110";
            document.getElementById('user-email').innerText = user.email || "Non communiquée";
            document.getElementById('user-id').innerText = "#" + rawId;
            document.getElementById('provider-badge').innerHTML = providerIcon;

            const isSub = (provider === 'twitch') && (localStorage.getItem('is_twitch_sub') === 'true');
            const discountContainer = document.getElementById('user-discount');
            if (isSub) {
                discountContainer.innerHTML = `<span class="badge-discount">-10% appliqué au panier</span>`;
            } else {
                discountContainer.innerHTML = `<span class="badge-nodiscount">Pas de réduction active</span>`;
            }

            chargerAdresseCompte();
        }

        function chargerAdresseCompte() {
            if (!currentAccountKey) return;

            const savedAddress = JSON.parse(localStorage.getItem('user_address_' + currentAccountKey));

            if (savedAddress) {
                document.getElementById('address-lastname').value = savedAddress.lastname || savedAddress.nom || '';
                document.getElementById('address-firstname').value = savedAddress.firstname || '';
                document.getElementById('address-phone').value = savedAddress.phone || '';
                document.getElementById('address-street').value = savedAddress.street || '';
                document.getElementById('address-zip').value = savedAddress.zip || '';
                document.getElementById('address-city').value = savedAddress.city || '';
            } else {
                document.getElementById('address-form').reset();
            }
        }

        function sauvegarderAdresse(event) {
            event.preventDefault();
            if (!currentAccountKey) return;

            const lastname = document.getElementById('address-lastname').value.trim();
            const firstname = document.getElementById('address-firstname').value.trim();

            const adresseData = {
                lastname: lastname,
                firstname: firstname,
                nom: `${firstname} ${lastname}`.trim(),
                phone: document.getElementById('address-phone').value,
                street: document.getElementById('address-street').value,
                zip: document.getElementById('address-zip').value,
                city: document.getElementById('address-city').value
            };

            localStorage.setItem('user_address_' + currentAccountKey, JSON.stringify(adresseData));
            alert('Coordonnées enregistrées en toute sécurité !');
        }

        window.addEventListener('DOMContentLoaded', chargerProfil);
    </script>
</body>
</html>
