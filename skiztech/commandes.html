<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Commandes - Skiztech</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f4f9; color: #333; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }
        
        .hero-banner { 
            width: 100%; height: 200px; overflow: hidden; background-color: #000; 
            box-shadow: inset 0 -20px 30px rgba(0,0,0,0.5); 
        }
        .hero-banner img { width: 100%; height: 100%; object-fit: cover; object-position: center; }

        /* Style Carte Commandes */
        .orders-card { background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; margin: 40px 0; padding: 30px; }
        .section-title { font-size: 1.4em; border-bottom: 2px solid #00bcd4; padding-bottom: 10px; margin-bottom: 25px; color: #1a1a1a; display: flex; align-items: center; gap: 10px; }
        
        /* Item Commande */
        .order-item { border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; margin-bottom: 25px; background-color: #fafafa; }
        .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; font-weight: 600; }
        .order-id { color: #00bcd4; font-size: 1.1em; }
        .order-date { color: #777; font-size: 0.9em; }
        
        .order-details { font-size: 0.95em; line-height: 1.8; margin-bottom: 20px; }
        .order-empty { text-align: center; padding: 40px 20px; color: #777; }
        .order-empty i { font-size: 3em; color: #ccc; margin-bottom: 10px; display: block; }

        /* --- STYLES TIMELINE / SUIVI DE COMMANDE --- */
        .tracking-wrapper { margin-top: 25px; padding-top: 15px; border-top: 1px dashed #ddd; }
        .tracking-title { font-size: 0.95em; font-weight: bold; color: #444; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .stepper { display: flex; justify-content: space-between; align-items: flex-start; position: relative; margin: 20px 0 10px 0; }
        
        /* Ligne grise en arrière-plan */
        .stepper::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 10%;
            right: 10%;
            height: 3px;
            background-color: #e0e0e0;
            z-index: 1;
        }

        .step-item { position: relative; z-index: 2; text-align: center; flex: 1; }
        
        .step-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: #fff;
            border: 3px solid #ccc;
            color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px auto;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .step-label { font-size: 0.75em; font-weight: 600; color: #888; text-transform: uppercase; line-height: 1.2; }

        /* États validés / actifs */
        .step-item.completed .step-icon {
            background-color: #00bcd4;
            border-color: #00bcd4;
            color: #fff;
        }
        .step-item.completed .step-label { color: #00bcd4; }

        .step-item.active .step-icon {
            background-color: #fff;
            border-color: #00bcd4;
            color: #00bcd4;
            box-shadow: 0 0 10px rgba(0, 188, 212, 0.4);
            transform: scale(1.1);
        }
        .step-item.active .step-label { color: #111; font-weight: bold; }

        @media (max-width: 600px) {
            .step-label { font-size: 0.65em; }
            .step-icon { width: 34px; height: 34px; font-size: 0.85em; }
            .stepper::before { top: 16px; }
        }

        footer { background-color: #1a1a1a; color: #fff; text-align: center; padding: 40px 20px; margin-top: 60px; }
        .footer-bottom { margin-top: 30px; padding-top: 20px; border-top: 1px solid #333; font-size: 0.9em; color: #aaa; }
        .footer-bottom span { color: #00bcd4; font-weight: bold; }
    </style>
</head>
<body>

    <section class="hero-banner">
        <img src="../images/banner-montage.png" alt="Bannière Skiztech">
    </section>

    <!-- Navigation unifiée (gérée via navbar.js) -->
    <header></header>

    <div class="container">
        <div class="orders-card">
            <div class="section-title">
                <i class="fas fa-box-open"></i> Historique et suivi de mes commandes
            </div>

            <div id="orders-list">
                <!-- Les commandes seront injectées dynamiquement ici -->
            </div>
        </div>
    </div>

    <footer id="contact">
        <div class="container">
            <div class="footer-bottom">
                Skiztech by <span>Skizcorp</span> &copy; 2026 — Tous droits réservés
            </div>
        </div>
    </footer>

    <!-- Script Navigation -->
    <script src="navbar.js"></script>

    <script>
        let currentAccountKey = null;

        // Fonction pour générer le composant de suivi d'étapes
        function renderTrackingSteps(currentStep = 1) {
            const steps = [
                { id: 1, icon: 'fa-box', label: 'Composants' },
                { id: 2, icon: 'fa-truck-ramp-box', label: 'Transit Atelier' },
                { id: 3, icon: 'fa-tools', label: 'Montage & Tests' },
                { id: 4, icon: 'fa-truck-fast', label: 'Expédition' },
                { id: 5, icon: 'fa-house-chimney-check', label: 'Livré' }
            ];

            return `
                <div class="tracking-wrapper">
                    <div class="tracking-title"><i class="fas fa-route" style="color: #00bcd4;"></i> Suivi d'avancement</div>
                    <div class="stepper">
                        ${steps.map(step => {
                            let stateClass = '';
                            if (step.id < currentStep) stateClass = 'completed';
                            else if (step.id === currentStep) stateClass = 'active';

                            return `
                                <div class="step-item ${stateClass}">
                                    <div class="step-icon">
                                        <i class="fas ${step.icon}"></i>
                                    </div>
                                    <div class="step-label">${step.label}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function chargerCommandes() {
            const authUser = JSON.parse(localStorage.getItem('auth_user'));
            const twitchUser = JSON.parse(localStorage.getItem('twitch_user'));
            const googleUser = JSON.parse(localStorage.getItem('google_user'));
            const discordUser = JSON.parse(localStorage.getItem('discord_user'));
            const genericUser = JSON.parse(localStorage.getItem('user_account'));

            let user = authUser || twitchUser || googleUser || discordUser || genericUser;

            if (!user) {
                window.location.href = "index.html#auth-box";
                return;
            }

            const provider = user.provider || (twitchUser ? 'twitch' : googleUser ? 'google' : discordUser ? 'discord' : 'standard');
            const rawId = user.id || user.sub || user.email || "0000";
            currentAccountKey = `${provider}_${rawId}`;

            // Récupération des commandes associées au compte
            const orders = JSON.parse(localStorage.getItem('user_orders_' + currentAccountKey)) || [];
            const listContainer = document.getElementById('orders-list');

            if (orders.length === 0) {
                listContainer.innerHTML = `
                    <div class="order-empty">
                        <i class="fas fa-shopping-bag"></i>
                        <p>Vous n'avez passé aucune commande pour le moment.</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = orders.map(order => {
                // Par défaut, une nouvelle commande est à l'étape 1
                const currentStep = order.step || 1;

                return `
                    <div class="order-item">
                        <div class="order-header">
                            <span class="order-id">Commande #${order.id}</span>
                            <span class="order-date"><i class="far fa-calendar-alt"></i> ${order.date}</span>
                        </div>
                        <div class="order-details">
                            <p><strong>Total :</strong> ${order.total} €</p>
                            <p><strong>Articles :</strong> ${order.items.join(', ')}</p>
                            ${order.instructions ? `<p><strong>Instructions :</strong> <em>${order.instructions}</em></p>` : ''}
                        </div>
                        
                        <!-- Injection du suivi avec icônes -->
                        ${renderTrackingSteps(currentStep)}
                    </div>
                `;
            }).join('');
        }

        window.addEventListener('DOMContentLoaded', chargerCommandes);
    </script>
</body>
</html>
