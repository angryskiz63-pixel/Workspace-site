<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AION 2 | Classes</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Sans:wght@300;400;700&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans', sans-serif;
      background-color: #080a0f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background-image: linear-gradient(to right, rgba(8, 10, 15, 0.85), rgba(8, 10, 15, 0.4)), url('images/fondclasses.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow-x: hidden;
    }

    /* BARRE DE NAVIGATION SUPÉRIEURE (BANDEAU NOIR) */
    .navbar {
      width: 100%;
      height: 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 50px;
      background: rgba(8, 10, 15, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 100;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: #ffffff;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      font-family: 'Cinzel', serif;
    }

    .nav-logo img {
      height: 40px;
      margin-right: 12px;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 35px;
    }

    .nav-links a {
      color: #cccccc;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      transition: color 0.3s, text-shadow 0.3s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #00d2ff;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
    }

    /* CONTENEUR PRINCIPAL */
    .classes-container {
      width: 100%;
      max-width: 1350px;
      padding: 10px 20px 0 20px;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
      justify-content: space-between;
      position: relative;
      z-index: 1;
    }

    /* TITRE DE SECTION */
    .section-title {
      font-family: 'Cinzel', serif;
      font-size: 3rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 5px;
      color: #f0f4f8;
      text-shadow: 0 0 20px rgba(0, 210, 255, 0.5), 0 0 5px rgba(255, 255, 255, 0.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 5px;
      z-index: 10;
    }

    /* STRUCTURE À 2 COLONNES */
    .class-display {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      justify-content: space-between;
      width: 100%;
      gap: 30px;
      flex-grow: 1;
      height: calc(100vh - 170px);
      max-height: 700px;
    }

    /* COLONNE GAUCHE : Personnage au sol */
    .character-portrait {
      flex: 1.1;
      display: flex;
      justify-content: flex-start;
      align-items: flex-end;
      max-width: 600px;
      height: 100%;
      position: relative;
    }

    .character-portrait img {
      width: auto;
      height: 100%;
      max-height: 650px; /* Augmenté pour laisser monter la tête */
      object-fit: contain;
      object-position: bottom left;
      filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.95));
      margin-bottom: 0;
      
      /* Ancrage strict en bas à gauche pour garder les pieds au sol */
      transform-origin: bottom left;
      /* Taille augmentée et décalage à gauche */
      transform: scale(1.35) translateX(-30px);
      transition: transform 0.35s ease-out;
    }

    /* Ajustement spécifique pour les modèles plus petits */
    .character-portrait img.scaled-up {
      transform: scale(1.48) translateX(-30px);
    }

    /* COLONNE DROITE : Textes + Vidéo */
    .class-content-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      max-width: 580px;
      margin-bottom: 30px;
      z-index: 2;
    }

    /* HEADER DE LA CLASSE (Logo réduit + Nom) */
    .class-header {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .class-icon {
      height: 65px;
      width: auto;
      max-width: 75px;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.7));
      transition: opacity 0.3s ease;
    }

    .class-name {
      font-family: 'Cinzel', serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.08em;
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(0, 210, 255, 0.5), 0 2px 5px rgba(0,0,0,0.9);
    }

    .class-description {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #d8e2ec;
      background: rgba(10, 15, 25, 0.65);
      padding: 18px 22px;
      border-left: 3px solid #00d2ff;
      border-radius: 0 8px 8px 0;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      min-height: 85px;
    }

    /* VIGNETTE DE LA VIDÉO */
    .video-box {
      width: 100%;
      aspect-ratio: 16/9;
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    .video-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.35);
      transition: background 0.3s;
    }

    .video-box:hover::before {
      background: rgba(0, 0, 0, 0.15);
    }

    .play-btn {
      width: 60px;
      height: 60px;
      background: rgba(0, 210, 255, 0.85);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
      transition: transform 0.2s, background 0.2s;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
    }

    .video-box:hover .play-btn {
      transform: scale(1.1);
      background: #00d2ff;
    }

    .play-btn::after {
      content: '';
      display: block;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 10px 0 10px 18px;
      border-color: transparent transparent transparent #ffffff;
      margin-left: 4px;
    }

    /* POPUP LECTEUR GRAND ÉCRAN (MODAL) */
    .video-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .video-modal.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      width: 80%;
      max-width: 1000px;
      aspect-ratio: 16/9;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
      border-radius: 8px;
      overflow: hidden;
    }

    .modal-content iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .close-modal {
      position: absolute;
      top: -45px;
      right: 0;
      color: #ffffff;
      font-size: 2rem;
      cursor: pointer;
      font-weight: 300;
      transition: color 0.2s;
    }

    .close-modal:hover {
      color: #00d2ff;
    }

    /* SÉLECTEUR DE CLASSES (BAS) */
    .class-selector {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      width: 100%;
      overflow-x: auto;
      padding: 15px 0 25px 0;
      background: linear-gradient(to top, rgba(8, 10, 15, 0.95), transparent);
      z-index: 10;
    }

    .class-btn {
      background: transparent;
      border: none;
      color: #888888;
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      padding: 10px 12px;
      transition: color 0.3s, text-shadow 0.3s;
      position: relative;
      white-space: nowrap;
    }

    .class-btn:hover {
      color: #ffffff;
    }

    .class-btn.active {
      color: #ffffff;
      text-shadow: 0 0 10px #00d2ff;
    }

    .class-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 8px;
      background-color: #00d2ff;
      border-radius: 50%;
      box-shadow: 0 0 8px #00d2ff;
    }

    @media (max-width: 900px) {
      .navbar {
        padding: 0 20px;
      }
      .class-display {
        flex-direction: column;
        align-items: center;
        height: auto;
      }
      .character-portrait img {
        transform: scale(1) translateX(0);
      }
      .class-content-right {
        max-width: 100%;
        margin-bottom: 20px;
      }
      .class-icon {
        height: 50px;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation Supérieure (Bandeau Noir) -->
  <header class="navbar">
    <a href="aion2.html" class="nav-logo">
      <img src="images/logo.png" alt="AION 2 Logo" onerror="this.style.display='none'" />
      AION 2
    </a>
    <nav>
      <ul class="nav-links">
        <li><a href="aion2.html">Accueil</a></li>
        <li><a href="#">Actualités</a></li>
        <li><a href="Classes.html" class="active">Classes</a></li>
        <li><a href="#">Média</a></li>
        <li><a href="#">Communauté</a></li>
      </ul>
    </nav>
  </header>

  <main class="classes-container">
    <h1 class="section-title">Classes</h1>

    <div class="class-display">
      <!-- Personnage agrandi avec tête montant juste sous le bandeau -->
      <div class="character-portrait">
        <img id="class-img" src="images/gladiateur.webp" alt="Gladiateur" />
      </div>

      <!-- Bloc de droite -->
      <div class="class-content-right">
        <div class="class-header">
          <img id="class-icon" class="class-icon" src="images/logo gladiateur.webp.png" alt="Logo Gladiateur" onerror="this.style.display='none'" />
          <h2 class="class-name" id="class-title">Gladiateur</h2>
        </div>
        
        <p class="class-description" id="class-desc">
          Un guerrier d'avant-garde qui manie une gigantesque lame et balaye ses ennemis à la manière d'une tempête.
        </p>

        <!-- Aperçu vidéo -->
        <div class="video-box" id="video-preview" onclick="openVideo()">
          <div class="play-btn"></div>
        </div>
      </div>
    </div>

    <!-- Barre des classes (Bas) -->
    <nav class="class-selector">
      <button class="class-btn active" data-class="gladiateur" onclick="onUserSelectClass('gladiateur', this)">Gladiateur</button>
      <button class="class-btn" data-class="templier" onclick="onUserSelectClass('templier', this)">Templier</button>
      <button class="class-btn" data-class="assassin" onclick="onUserSelectClass('assassin', this)">Assassin</button>
      <button class="class-btn" data-class="rodeur" onclick="onUserSelectClass('rodeur', this)">Rôdeur</button>
      <button class="class-btn" data-class="aede" onclick="onUserSelectClass('aede', this)">Aède</button>
      <button class="class-btn" data-class="clerc" onclick="onUserSelectClass('clerc', this)">Clerc</button>
      <button class="class-btn" data-class="sorcier" onclick="onUserSelectClass('sorcier', this)">Sorcier</button>
      <button class="class-btn" data-class="spiritualiste" onclick="onUserSelectClass('spiritualiste', this)">Spiritualiste</button>
    </nav>
  </main>

  <!-- Modal Lecteur vidéo Grand Écran -->
  <div class="video-modal" id="video-modal" onclick="closeVideoOnBg(event)">
    <div class="modal-content">
      <span class="close-modal" onclick="closeVideo()">&times;</span>
      <iframe id="youtube-player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    let currentVideoId = "ndri5XpnRK4";
    let autoRotateInterval = null;
    let currentClassIndex = 0;

    const classKeys = [
      'gladiateur',
      'templier',
      'assassin',
      'rodeur',
      'aede',
      'clerc',
      'sorcier',
      'spiritualiste'
    ];

    const classesData = {
      gladiateur: {
        title: "Gladiateur",
        desc: "Un guerrier d'avant-garde qui manie une gigantesque lame et balaye ses ennemis à la manière d'une tempête.",
        img: "images/gladiateur.webp",
        icon: "images/logo gladiateur.webp.png",
        youtubeId: "ndri5XpnRK4",
        scaleUp: false
      },
      templier: {
        title: "Templier",
        desc: "Un protecteur inébranlable utilisant bouclier et épée pour encaisser les assauts et protéger ses alliés.",
        img: "images/Templier.webp",
        icon: "images/Templarlogo.png",
        youtubeId: "Zs6HnL2N5Hk",
        scaleUp: false
      },
      assassin: {
        title: "Assassin",
        desc: "Maître de la discrétion et des attaques rapides dans le dos, éliminant ses cibles avant même d'être repéré.",
        img: "images/Assassin.webp",
        icon: "images/logo Assassin.webp.png",
        youtubeId: "jUW24SLKK3I",
        scaleUp: false
      },
      rodeur: {
        title: "Rôdeur",
        desc: "Un archer d'élite capable de frapper à distance tout en posant des pièges mortels sur le terrain.",
        img: "images/Rodeur.webp",
        icon: "images/logo rodeur.webp.png",
        youtubeId: "C6INRqEqv3Y",
        scaleUp: true
      },
      aede: {
        title: "Aède",
        desc: "Un combattant au bâton renforçant le groupe grâce à des mantras puissants et des soins de soutien.",
        img: "images/Chanter.webp",
        icon: "images/logo Aede.png",
        youtubeId: "rtOt3KvmYCI",
        scaleUp: true
      },
      clerc: {
        title: "Clerc",
        desc: "Le pilier de soutien par excellence, capable de soigner les blessures graves et d'invoquer la fureur divine.",
        img: "images/Cleric.webp",
        icon: "images/logo Clerc.png",
        youtubeId: "RU-4yiNNnY0",
        scaleUp: false
      },
      sorcier: {
        title: "Sorcier",
        desc: "Un maître des éléments déchaînant le feu et la glace pour infliger des dégâts magiques dévastateurs.",
        img: "images/Sorcerer.webp",
        icon: "images/logo Sorcier.webp.png",
        youtubeId: "jh1ydFq6FI0",
        scaleUp: false
      },
      spiritualiste: {
        title: "Spiritualiste",
        desc: "Un invocateur commandant aux esprits élémentaires pour affaiblir et contrôler ses adversaires.",
        img: "images/Spiritualist.webp",
        icon: "images/logo Spiritualiste.png",
        youtubeId: "LJq1QGRJSLI",
        scaleUp: false
      }
    };

    function updateVideoPreview(youtubeId) {
      currentVideoId = youtubeId;
      const previewBox = document.getElementById('video-preview');
      previewBox.style.backgroundImage = `url('https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg')`;
    }

    function selectClass(classKey, element) {
      if (classesData[classKey]) {
        const data = classesData[classKey];
        const imgElement = document.getElementById('class-img');
        const iconElement = document.getElementById('class-icon');

        document.getElementById('class-title').innerText = data.title;
        document.getElementById('class-desc').innerText = data.desc;
        imgElement.src = data.img;
        imgElement.alt = data.title;

        iconElement.src = data.icon;
        iconElement.alt = "Logo " + data.title;
        iconElement.style.display = 'inline-block';

        if (data.scaleUp) {
          imgElement.classList.add('scaled-up');
        } else {
          imgElement.classList.remove('scaled-up');
        }

        updateVideoPreview(data.youtubeId);

        const buttons = document.querySelectorAll('.class-btn');
        buttons.forEach(btn => btn.classList.remove('active'));

        if (!element) {
          element = document.querySelector(`.class-btn[data-class="${classKey}"]`);
        }
        if (element) {
          element.classList.add('active');
        }
      }
    }

    function stopAutoRotate() {
      if (autoRotateInterval) {
        clearInterval(autoRotateInterval);
        autoRotateInterval = null;
      }
    }

    function onUserSelectClass(classKey, element) {
      stopAutoRotate();
      currentClassIndex = classKeys.indexOf(classKey);
      selectClass(classKey, element);
    }

    function startAutoRotate() {
      autoRotateInterval = setInterval(() => {
        currentClassIndex = (currentClassIndex + 1) % classKeys.length;
        const nextClassKey = classKeys[currentClassIndex];
        selectClass(nextClassKey);
      }, 4000);
    }

    function openVideo() {
      stopAutoRotate();
      const modal = document.getElementById('video-modal');
      const player = document.getElementById('youtube-player');
      player.src = `https://www.youtube.com/embed/${currentVideoId}?autoplay=1&rel=0`;
      modal.classList.add('active');
    }

    function closeVideo() {
      const modal = document.getElementById('video-modal');
      const player = document.getElementById('youtube-player');
      player.src = '';
      modal.classList.remove('active');
    }

    function closeVideoOnBg(event) {
      if (event.target.id === 'video-modal') {
        closeVideo();
      }
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        closeVideo();
      }
    });

    // Initialisation
    updateVideoPreview(currentVideoId);
    startAutoRotate();
  </script>

</body>
</html>
