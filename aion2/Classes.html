<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AION 2 | Classes</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;700&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans', sans-serif;
      background-color: #080a0f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background-image: linear-gradient(to right, rgba(8, 10, 15, 0.85), rgba(8, 10, 15, 0.4)), url('images/fondclasses.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow-x: hidden;
    }

    /* Conteneur principal */
    .classes-container {
      width: 100%;
      max-width: 1250px;
      padding: 40px 20px;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Titre de la page */
    .section-title {
      font-size: 3rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-weight: 300;
      margin-bottom: 30px;
      text-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 10px;
    }

    /* Structure principale à 2 colonnes */
    .class-display {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 50px;
      margin-bottom: 40px;
    }

    /* COLONNE GAUCHE : Grande image du personnage */
    .character-portrait {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      max-width: 450px;
    }

    .character-portrait img {
      width: 100%;
      max-height: 600px;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
    }

    /* COLONNE DROITE : Textes + Vidéo */
    .class-content-right {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 600px;
    }

    .class-name {
      font-size: 2.8rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .class-description {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #cccccc;
      background: rgba(0, 0, 0, 0.5);
      padding: 18px 22px;
      border-left: 3px solid #00d2ff;
      border-radius: 0 8px 8px 0;
      backdrop-filter: blur(5px);
    }

    /* Cadre vidéo */
    .video-box {
      width: 100%;
      aspect-ratio: 16/9;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .play-btn {
      width: 60px;
      height: 60px;
      background: rgba(0, 210, 255, 0.85);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
    }

    .play-btn:hover {
      transform: scale(1.1);
      background: #00d2ff;
    }

    .play-btn::after {
      content: '';
      display: block;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 10px 0 10px 18px;
      border-color: transparent transparent transparent #ffffff;
      margin-left: 4px;
    }

    /* Sélecteur de classes horizontal en bas */
    .class-selector {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      width: 100%;
      overflow-x: auto;
      padding: 15px 0;
    }

    .class-btn {
      background: transparent;
      border: none;
      color: #888888;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      padding: 10px 15px;
      transition: color 0.3s, text-shadow 0.3s;
      position: relative;
      white-space: nowrap;
    }

    .class-btn:hover {
      color: #ffffff;
    }

    .class-btn.active {
      color: #ffffff;
      text-shadow: 0 0 10px #00d2ff;
    }

    .class-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 8px;
      background-color: #00d2ff;
      border-radius: 50%;
      box-shadow: 0 0 8px #00d2ff;
    }

    @media (max-width: 850px) {
      .class-display {
        flex-direction: column;
      }
      .class-content-right {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <main class="classes-container">
    <h1 class="section-title">Classes</h1>

    <div class="class-display">
      <div class="character-portrait">
        <img id="class-img" src="images/gladiateur.webp" alt="Gladiateur" />
      </div>

      <div class="class-content-right">
        <h2 class="class-name" id="class-title">Gladiateur</h2>
        
        <p class="class-description" id="class-desc">
          Un guerrier d'avant-garde qui manie une gigantesque lame et balaye ses ennemis à la manière d'une tempête.
        </p>

        <div class="video-box">
          <div class="play-btn"></div>
        </div>
      </div>
    </div>

    <nav class="class-selector">
      <button class="class-btn active" onclick="selectClass('gladiateur', this)">Gladiateur</button>
      <button class="class-btn" onclick="selectClass('templier', this)">Templier</button>
      <button class="class-btn" onclick="selectClass('assassin', this)">Assassin</button>
      <button class="class-btn" onclick="selectClass('rodeur', this)">Rôdeur</button>
      <button class="class-btn" onclick="selectClass('aede', this)">Aède</button>
      <button class="class-btn" onclick="selectClass('clerc', this)">Clerc</button>
      <button class="class-btn" onclick="selectClass('sorcier', this)">Sorcier</button>
      <button class="class-btn" onclick="selectClass('spiritualiste', this)">Spiritualiste</button>
    </nav>
  </main>

  <script>
    const classesData = {
      gladiateur: {
        title: "Gladiateur",
        desc: "Un guerrier d'avant-garde qui manie une gigantesque lame et balaye ses ennemis à la manière d'une tempête.",
        img: "images/gladiateur.webp"
      },
      templier: {
        title: "Templier",
        desc: "Un protecteur inébranlable utilisant bouclier et épée pour encaisser les assauts et protéger ses alliés.",
        img: "images/templier.webp"
      },
      assassin: {
        title: "Assassin",
        desc: "Maître de la discrétion et des attaques rapides dans le dos, éliminant ses cibles avant même d'être repéré.",
        img: "images/assassin.webp"
      },
      rodeur: {
        title: "Rôdeur",
        desc: "Un archer d'élite capable de frapper à distance tout en posant des pièges mortels sur le terrain.",
        img: "images/rodeur.webp"
      },
      aede: {
        title: "Aède",
        desc: "Un combattant au bâton renforçant le groupe grâce à des mantras puissants et des soins de soutien.",
        img: "images/aede.webp"
      },
      clerc: {
        title: "Clerc",
        desc: "Le pilier de soutien par excellence, capable de soigner les blessures graves et d'invoquer la fureur divine.",
        img: "images/clerc.webp"
      },
      sorcier: {
        title: "Sorcier",
        desc: "Un maître des éléments déchaînant le feu et la glace pour infliger des dégâts magiques dévastateurs.",
        img: "images/sorcier.webp"
      },
      spiritualiste: {
        title: "Spiritualiste",
        desc: "Un invocateur commandant aux esprits élémentaires pour affaiblir et contrôler ses adversaires.",
        img: "images/spiritualiste.webp"
      }
    };

    function selectClass(classKey, element) {
      if (classesData[classKey]) {
        document.getElementById('class-title').innerText = classesData[classKey].title;
        document.getElementById('class-desc').innerText = classesData[classKey].desc;
        document.getElementById('class-img').src = classesData[classKey].img;
        document.getElementById('class-img').alt = classesData[classKey].title;

        const buttons = document.querySelectorAll('.class-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        if (element) {
          element.classList.add('active');
        }
      }
    }
  </script>

</body>
</html>
