<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="images/logo-aion2bis.png" />
  <link rel="shortcut icon" type="image/png" href="images/logo-aion2bis.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Aion 2 | Accueil</title>
  <meta name="description" content="Base de connaissances, guides, builds, actualités et codes pour Aion 2. Fansite communautaire francophone." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-main: #070b16;
      --bg-card: rgba(15, 23, 42, 0.85);
      --border-card: rgba(0, 242, 254, 0.25);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-gold: #ffb74d;
      --accent-purple: #a855f7;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    html { scroll-behavior: smooth; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Aion 2 */
    .aion-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background: linear-gradient(180deg, rgba(7, 11, 22, 0.95) 0%, rgba(7, 11, 22, 0.7) 100%);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0 4%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .aion-logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      height: 100%;
      position: relative;
      width: 120px;
    }

    .aion-logo-img {
      height: 100px;
      width: auto;
      object-fit: contain;
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      transition: transform 0.3s ease;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.9));
      z-index: 10;
    }

    .aion-logo-img:hover { transform: translateY(-50%) scale(1.05); }

    .aion-partner-container {
      position: absolute;
      left: 28%;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 15;
      max-height: 60px;
    }

    .aion-lagofast {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .aion-lagofast-img {
      height: 60px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.5));
      transition: all 0.3s ease;
    }

    .aion-lagofast-img:hover {
      transform: scale(1.08);
      filter: drop-shadow(0 0 18px rgba(0, 242, 254, 0.9));
    }

    .aion-flag-belgique {
      height: 36px;
      width: auto;
      max-height: 36px;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.7));
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.3s ease;
      display: block;
    }

    .aion-flag-belgique:hover {
      transform: scale(1.1);
    }

    .aion-menu { 
      display: flex; 
      gap: 18px; 
      list-style: none; 
      margin-left: auto;
      align-items: center;
    }

    .aion-menu a {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: 0.2s;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .aion-menu a:hover { color: var(--accent-cyan); }

    .coming-soon-group {
      position: relative;
      display: flex;
      gap: 18px;
      align-items: center;
      padding-top: 10px;
    }

    .coming-soon-group::before {
      content: 'COMING SOON';
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.62rem;
      font-weight: 800;
      color: var(--accent-gold);
      letter-spacing: 0.1em;
      white-space: nowrap;
      text-shadow: 0 0 6px rgba(255, 183, 77, 0.6);
      pointer-events: none;
    }

    .coming-soon-group a { opacity: 0.6; cursor: not-allowed; }
    .coming-soon-group a:hover { color: var(--text-main); }

    .aion-fav-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-card);
      color: var(--accent-gold);
      padding: 7px 14px;
      border-radius: 20px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .aion-fav-btn:hover {
      background: var(--accent-gold);
      color: #070b16;
      border-color: var(--accent-gold);
      box-shadow: 0 0 12px rgba(255, 183, 77, 0.5);
    }

    .aion-discord-btn {
      background: #5865F2;
      color: #fff !important;
      padding: 8px 18px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: bold !important;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(88, 101, 242, 0.4);
      transition: all 0.2s ease !important;
    }

    .aion-discord-btn:hover {
      background: #4752C4;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(88, 101, 242, 0.6);
    }

    /* Hero Section */
    .aion-hero {
      position: relative;
      min-height: calc(100vh - 140px);
      max-height: 850px;
      width: 100%;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      text-align: center;
      margin-top: 70px;
    }

    .slider-bg { position: absolute; inset: 0; z-index: 0; }
    .slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center top;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }
    .slide.active { opacity: 1; }

    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      background: rgba(7, 11, 22, 0.6);
      border: 1px solid var(--border-card);
      color: var(--text-main);
      font-size: 1.3rem;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
    }

    .slider-btn:hover {
      background: var(--accent-cyan);
      color: #070b16;
      box-shadow: 0 0 15px var(--accent-cyan);
    }

    .slider-btn.prev { left: 25px; }
    .slider-btn.next { right: 25px; }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7,11,22,0.2) 0%, rgba(7,11,22,0.5) 65%, rgba(7,11,22,1) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 1200px;
      padding: 0 20px 90px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .hero-content h1 {
      font-family: 'Cinzel', serif;
      font-size: 3.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(to right, #ffffff, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      text-shadow: 0 4px 15px rgba(0,0,0,0.9);
    }

    .hero-content p { font-size: 1.2rem; color: #cbd5e1; text-shadow: 0 2px 10px rgba(0,0,0,0.9); margin-bottom: 15px; }

    /* BOUTON D'ACTION VOYANT GUILDE UNLEASHED */
    .hero-unleashed-cta {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, var(--accent-purple) 0%, #7e22ce 100%);
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 16px 36px;
      border-radius: 50px;
      text-decoration: none;
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.3);
      margin-bottom: 25px;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: pulse-glow 2s infinite alternate;
    }

    .hero-unleashed-cta:hover {
      transform: scale(1.06) translateY(-3px);
      box-shadow: 0 0 40px rgba(168, 85, 247, 0.9), inset 0 0 20px rgba(255, 255, 255, 0.5);
      border-color: #ffffff;
      color: #ffffff;
    }

    @keyframes pulse-glow {
      0% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.5); }
      100% { box-shadow: 0 0 35px rgba(168, 85, 247, 0.9), 0 0 15px rgba(0, 242, 254, 0.4); }
    }

    /* Countdowns Wrapper */
    .countdowns-wrapper {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 800px;
      margin-top: 5px;
    }

    .launch-countdown-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-card);
      backdrop-filter: blur(12px);
      padding: 14px 16px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 242, 254, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .countdown-header {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--accent-gold);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
      text-shadow: 0 0 8px rgba(255, 183, 77, 0.4);
      white-space: nowrap;
    }

    .countdown-header.early-header {
      color: var(--accent-purple);
      text-shadow: 0 0 8px rgba(168, 85, 247, 0.4);
    }

    .countdown-timer {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .time-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 38px;
    }

    .time-val {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 12px var(--accent-cyan);
      line-height: 1;
    }

    .time-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 600;
    }

    .time-separator {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--accent-cyan);
      margin-top: -10px;
      opacity: 0.7;
    }

    /* Quick Links */
    .quick-links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      max-width: 1400px;
      margin: -70px auto 40px auto;
      padding: 0 20px;
      position: relative;
      z-index: 10;
      width: 100%;
    }

    .quick-card {
      position: relative;
      height: 110px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-card);
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .quick-card-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: transform 0.5s ease;
      z-index: 1;
    }

    .quick-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7, 11, 22, 0.4) 0%, rgba(7, 11, 22, 0.88) 100%);
      z-index: 2;
      transition: background 0.3s ease;
    }

    .quick-card h3 {
      position: relative;
      z-index: 3;
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      transition: color 0.3s ease, transform 0.3s ease;
    }

    .quick-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-cyan);
      box-shadow: 0 12px 30px rgba(0, 242, 254, 0.3);
    }

    .quick-card:hover .quick-card-bg {
      transform: scale(1.1);
    }

    .quick-card:hover .quick-card-overlay {
      background: linear-gradient(180deg, rgba(7, 11, 22, 0.2) 0%, rgba(7, 11, 22, 0.75) 100%);
    }

    .quick-card:hover h3 {
      color: var(--accent-cyan);
      transform: scale(1.05);
    }

    .quick-card.card-unleashed { border-color: rgba(168, 85, 247, 0.4); }
    .quick-card.card-unleashed:hover { border-color: var(--accent-purple); box-shadow: 0 12px 30px rgba(168, 85, 247, 0.35); }
    .quick-card.card-unleashed:hover h3 { color: #d8b4fe; }

    .quick-card.card-discord { border-color: rgba(88, 101, 242, 0.4); }
    .quick-card.card-discord:hover { border-color: #5865F2; box-shadow: 0 12px 30px rgba(88, 101, 242, 0.4); }

    .quick-card.disabled-card {
      opacity: 0.55;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.1);
      pointer-events: none;
    }

    .quick-card.disabled-card .quick-card-bg {
      filter: grayscale(80%);
    }

    .quick-card.disabled-card::after {
      content: 'COMING SOON';
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.6rem;
      font-weight: 800;
      color: var(--accent-gold);
      letter-spacing: 0.12em;
      white-space: nowrap;
      text-shadow: 0 0 6px rgba(255, 183, 77, 0.9);
      z-index: 4;
    }

    .main-layout {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px 60px 20px;
      display: grid;
      grid-template-columns: 2.3fr 1fr;
      gap: 35px;
      width: 100%;
    }

    .section-title {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--border-card);
      padding-bottom: 10px;
      scroll-margin-top: 90px;
    }

    .section-title a { color: var(--accent-cyan); font-size: 0.95rem; text-decoration: none; font-family: 'Outfit'; }

    .ln-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; }
    
    .ln-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 14px;
      overflow: hidden;
      text-decoration: none;
      color: white;
      transition: 0.3s;
      display: flex;
      flex-direction: column;
    }

    .ln-card:hover { transform: translateY(-5px); border-color: var(--accent-cyan); }
    .ln-img { height: 320px; width: 100%; background-size: cover; background-position: center top; transition: transform 0.3s ease; }
    .ln-card:hover .ln-img { transform: scale(1.03); }
    .ln-body { padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; background: var(--bg-card); }
    .ln-title { font-weight: 700; font-size: 1.05rem; line-height: 1.35; }
    .ln-date { font-size: 0.85rem; color: var(--text-muted); margin-top: auto; }

    .sidebar-section { display: flex; flex-direction: column; gap: 35px; }
    
    .side-box {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 14px;
      padding: 22px;
    }

    .tag { font-size: 0.75rem; padding: 4px 9px; border-radius: 4px; font-weight: bold; width: fit-content; }
    .tag-off { background: var(--accent-cyan); color: #070b16; }

    .news-item { display: flex; gap: 14px; text-decoration: none; color: white; margin-bottom: 18px; }
    .news-thumb { width: 90px; height: 70px; border-radius: 8px; background-size: cover; background-position: center; flex-shrink: 0; }
    .news-title { font-size: 0.95rem; font-weight: 600; line-height: 1.3; }

    footer {
      margin-top: auto;
      background: rgba(7, 11, 22, 0.98);
      border-top: 1px solid var(--border-card);
      padding: 35px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    @media (max-width: 1100px) {
      .aion-partner-container { left: 20%; }
      .countdowns-wrapper { grid-template-columns: 1fr; max-width: 400px; }
    }

    @media (max-width: 900px) {
      .aion-hero { height: auto; min-height: auto; }
      .main-layout { grid-template-columns: 1fr; }
      .hero-content { padding-bottom: 60px; }
      .hero-content h1 { font-size: 2.2rem; }
      .hero-content p { font-size: 1.05rem; }
      .hero-unleashed-cta { font-size: 0.95rem; padding: 12px 24px; width: 100%; justify-content: center; }
      .aion-logo-img { height: 60px; }
      .ln-img { height: 240px; }
      .aion-menu { display: none; }
      .quick-links { margin-top: -40px; grid-template-columns: repeat(2, 1fr); }
      .aion-partner-container { display: none; }
      .time-val { font-size: 1.3rem; }
      .time-block { min-width: 32px; }
      .countdown-timer { gap: 6px; }
    }
  </style>
</head>
<body>

  <nav class="aion-nav">
    <a href="aion2.html" class="aion-logo">
      <img src="images/logo-aion2bis.png" alt="Aion 2 Logo" class="aion-logo-img">
    </a>

    <!-- LagoFast + Drapeau belge -->
    <div class="aion-partner-container">
      <a href="https://www.angryskiz.fr/aion2/Lagofast.html" class="aion-lagofast">
        <img src="images/logo-lagofast.png" alt="LagoFast" class="aion-lagofast-img">
      </a>
      <img src="images/belgique.png" alt="Drapeau Belgique" class="flag-icon">
    </div>

    <ul class="aion-menu">
      <li><a href="https://www.angryskiz.fr/aion2.html#actualites">Actualités</a></li>
      <li><a href="Classes.html" class="active">Classes</a></li>
      <li class="coming-soon-group">
        <a href="#">Builds</a>
        <a href="#">Guides</a>
        <a href="#">Patchs</a>
      </li>
      <li><a href="Unleashed.html">UNLEASHED</a></li>
      <li>
        <button onclick="ajouterFavoris()" class="aion-fav-btn">
          <i class="fas fa-star"></i> Favoris
        </button>
      </li>
      <li>
        <a href="https://discord.gg/eJvZcncpRN" target="_blank" class="aion-discord-btn">
          <i class="fab fa-discord"></i> Discord
        </a>
      </li>
    </ul>
  </nav>

  <main class="classes-container">
    <h1 class="section-title">Classes</h1>

    <div class="class-display">
      <div class="character-portrait">
        <img id="class-img" class="fade-right" src="images/gladiateur.webp" alt="Gladiateur" />
      </div>

      <div class="class-content-right fade-left" id="class-content-right">
        <div class="class-header">
          <img id="class-icon" class="class-icon" src="images/gladiateurlogo.png" alt="Logo Gladiateur" onerror="this.style.display='none'" />
          <h2 class="class-name" id="class-title">Gladiateur</h2>
        </div>

        <p class="class-description" id="class-desc">
          Un guerrier d'avant-garde qui manie une gigantesque lame et balaye ses ennemis à la manière d'une tempête.
        </p>

        <div class="video-box" id="video-preview" onclick="openVideo()">
          <div class="play-btn"></div>
        </div>
      </div>

    <nav class="class-selector">

      <button class="class-btn" data-class="templier" onclick="onUserSelectClass('templier', this)">Templier</button>
      <button class="class-btn" data-class="assassin" onclick="onUserSelectClass('assassin', this)">Assassin</button>
      <button class="class-btn" data-class="rodeur" onclick="onUserSelectClass('rodeur', this)">Rôdeur</button>
      <button class="class-btn" data-class="aede" onclick="onUserSelectClass('aede', this)">Aède</button>
      <button class="class-btn" data-class="clerc" onclick="onUserSelectClass('clerc', this)">Clerc</button>
      <button class="class-btn" data-class="sorcier" onclick="onUserSelectClass('sorcier', this)">Sorcier</button>
      <button class="class-btn" data-class="spiritualiste" onclick="onUserSelectClass('spiritualiste', this)">Spiritualiste</button>
    </nav>
  </main>

  <div class="video-modal" id="video-modal" onclick="closeVideoOnBg(event)">
    <div class="modal-content">
      <span class="close-modal" onclick="closeVideo()">&times;</span>
      <iframe id="youtube-player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    let currentVideoId = "ndri5XpnRK4";
    let autoRotateInterval = null;
    let currentClassIndex = 0;

    const classKeys = [
      'gladiateur',
      'templier',
      'assassin',
      'rodeur',
      'aede',
      'clerc',
      'sorcier',
      'spiritualiste'
    ];

    const classesData = {
      gladiateur: {
        title: "Gladiateur",
        desc: "Un guerrier d'avant-garde qui manie une gigantesque lame et balaye ses ennemis à la manière d'une tempête.",
        img: "images/gladiateur.webp",
        icon: "images/gladiateurlogo.png",
        youtubeId: "ndri5XpnRK4",
        customScale: 1.0
      },
      templier: {
        title: "Templier",
        desc: "Un protecteur inébranlable utilisant bouclier et épée pour encaisser les assauts et protéger ses alliés.",
        img: "images/Templier.webp",
        icon: "images/Templarlogo.png",
        youtubeId: "Zs6HnL2N5Hk",
        customScale: 1.0
      },
      assassin: {
        title: "Assassin",
        desc: "Maître de la discrétion et des attaques rapides dans le dos, éliminant ses cibles avant même d'être repéré.",
        img: "images/Assassin.webp",
        icon: "images/assassinlogo.png",
        youtubeId: "jUW24SLKK3I",
        customScale: 1.0
      },
      rodeur: {
        title: "Rôdeur",
        desc: "Un archer d'élite capable de frapper à distance tout en posant des pièges mortels sur le terrain.",
        img: "images/Rodeur.webp",
        icon: "images/archerlogo.png",
        youtubeId: "C6INRqEqv3Y",
        customScale: 1.0
      },
      aede: {
        title: "Aède",
        desc: "Un combattant au bâton renforçant le groupe grâce à des mantras puissants et des soins de soutien.",
        img: "images/Chanter.webp",
        icon: "images/aedelogo.png",
        youtubeId: "rtOt3KvmYCI",
        customScale: 1.0
      },
      clerc: {
        title: "Clerc",
        desc: "Le pilier de soutien par excellence, capable de soigner les blessures graves et d'invoquer la fureur divine.",
        img: "images/Cleric.webp",
        icon: "images/clerclogo.png",
        youtubeId: "RU-4yiNNnY0",
        customScale: 1.0
      },
      sorcier: {
        title: "Sorcier",
        desc: "Un maître des éléments déchaînant le feu et la glace pour infliger des dégâts magiques dévastateurs.",
        img: "images/Sorcerer.webp",
        icon: "images/sorcierlogo.png",
        youtubeId: "jh1ydFq6FI0",
        customScale: 1.0
      },
      spiritualiste: {
        title: "Spiritualiste",
        desc: "Un invocateur commandant aux esprits élémentaires pour affaiblir et contrôler ses adversaires.",
        img: "images/Spiritualist.webp",
        icon: "images/spiritlogo.png",
        youtubeId: "LJq1QGRJSLI",
        customScale: 1.0
      }
    };

    function updateVideoPreview(youtubeId) {
      currentVideoId = youtubeId;
      const previewBox = document.getElementById('video-preview');
      const maxResUrl = `https://img.youtube.com/vi/${youtubeId}/maxresdefault.jpg`;
      const hqUrl = `https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg`;

      const img = new Image();
      img.src = maxResUrl;
      img.onload = function() {
        if (this.width > 120) {
          previewBox.style.backgroundImage = `url('${maxResUrl}')`;
        } else {
          previewBox.style.backgroundImage = `url('${hqUrl}')`;
        }
      };
      img.onerror = function() {
        previewBox.style.backgroundImage = `url('${hqUrl}')`;
      };
    }

    function triggerFadeAnimation() {
      const imgElement = document.getElementById('class-img');
      const rightContent = document.getElementById('class-content-right');

      imgElement.classList.remove('fade-right');
      rightContent.classList.remove('fade-left');

      void imgElement.offsetWidth;
      void rightContent.offsetWidth;

      imgElement.classList.add('fade-right');
      rightContent.classList.add('fade-left');
    }

    function selectClass(classKey, element) {
      if (classesData[classKey]) {
        const data = classesData[classKey];
        const imgElement = document.getElementById('class-img');
        const iconElement = document.getElementById('class-icon');

        document.getElementById('class-title').innerText = data.title;
        document.getElementById('class-desc').innerText = data.desc;
        imgElement.src = data.img;
        imgElement.alt = data.title;

        const scaleVal = data.customScale || 1.0;
        imgElement.style.setProperty('--current-scale', scaleVal);

        iconElement.src = data.icon;
        iconElement.alt = "Logo " + data.title;
        iconElement.style.display = 'inline-block';

        updateVideoPreview(data.youtubeId);
        triggerFadeAnimation();

        const buttons = document.querySelectorAll('.class-btn');
        buttons.forEach(btn => btn.classList.remove('active'));

        if (!element) {
          element = document.querySelector(`.class-btn[data-class="${classKey}"]`);
        }
        if (element) {
          element.classList.add('active');
        }
      }
    }

    function stopAutoRotate() {
      if (autoRotateInterval) {
        clearInterval(autoRotateInterval);
        autoRotateInterval = null;
      }
    }

    function onUserSelectClass(classKey, element) {
      stopAutoRotate();
      currentClassIndex = classKeys.indexOf(classKey);
      selectClass(classKey, element);
    }

    function startAutoRotate() {
      autoRotateInterval = setInterval(() => {
        currentClassIndex = (currentClassIndex + 1) % classKeys.length;
        const nextClassKey = classKeys[currentClassIndex];
        selectClass(nextClassKey);
      }, 4000);
    }

    function openVideo() {
      stopAutoRotate();
      const modal = document.getElementById('video-modal');
      const player = document.getElementById('youtube-player');
      player.src = `https://www.youtube.com/embed/${currentVideoId}?autoplay=1&rel=0`;
      modal.classList.add('active');
    }

    function closeVideo() {
      const modal = document.getElementById('video-modal');
      const player = document.getElementById('youtube-player');
      player.src = '';
      modal.classList.remove('active');
    }

    function closeVideoOnBg(event) {
      if (event.target.id === 'video-modal') {
        closeVideo();
      }
    }

    function ajouterFavoris() {
      const title = document.title;
      const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
      const shortcut = isMac ? 'Cmd + D' : 'Ctrl + D';

      alert(`Appuyez sur ${shortcut} pour ajouter "${title}" à vos favoris !`);
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        closeVideo();
      }
    });

    selectClass('gladiateur'); 
    startAutoRotate();
  </script>

</body>
</html>
