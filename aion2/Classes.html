<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AION 2 | Classes</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;700&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans', sans-serif;
      background-color: #080a0f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background-image: linear-gradient(to right, rgba(8, 10, 15, 0.85), rgba(8, 10, 15, 0.4)), url('images/fondclasses.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow-x: hidden;
    }

    /* BARRE DE NAVIGATION SUPÉRIEURE */
    .navbar {
      width: 100%;
      height: 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 50px;
      background: rgba(8, 10, 15, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: #ffffff;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .nav-logo img {
      height: 40px;
      margin-right: 12px;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 35px;
    }

    .nav-links a {
      color: #cccccc;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      transition: color 0.3s, text-shadow 0.3s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #00d2ff;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
    }

    /* CONTENEUR PRINCIPAL */
    .classes-container {
      width: 100%;
      max-width: 1300px;
      padding: 20px 20px 0 20px;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
      justify-content: space-between;
    }

    .section-title {
      font-size: 2.8rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-weight: 300;
      margin-bottom: 20px;
      text-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 8px;
    }

    /* STRUCTURE À 2 COLONNES */
    .class-display {
      display: flex;
      flex-direction: row;
      align-items: flex-end; /* Alignement strict au sol */
      justify-content: center;
      width: 100%;
      gap: 40px;
      flex-grow: 1;
      height: 650px;
    }

    /* COLONNE GAUCHE : Personnage au sol */
    .character-portrait {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      max-width: 550px;
      height: 100%;
      overflow: hidden;
    }

    .character-portrait img {
      width: 100%;
      height: 100%;
      max-height: 650px;
      object-fit: contain;
      object-position: bottom;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.9));
      margin-bottom: -5px; /* Aligné sur le sol */
      transform-origin: bottom center;
      transition: transform 0.3s ease;
    }

    /* Classe utilitaire pour agrandir l'Aède et le Rôdeur */
    .character-portrait img.scaled-up {
      transform: scale(1.15);
    }

    /* COLONNE DROITE : Textes + Vidéo */
    .class-content-right {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      max-width: 600px;
      margin-bottom: 50px;
    }

    .class-name {
      font-size: 2.8rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .class-description {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #cccccc;
      background: rgba(0, 0, 0, 0.5);
      padding: 18px 22px;
      border-left: 3px solid #00d2ff;
      border-radius: 0 8px 8px 0;
      backdrop-filter: blur(5px);
      min-height: 90px;
    }

    /* VIGNETTE DE LA VIDÉO */
    .video-box {
      width: 100%;
      aspect-ratio: 16/9;
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    .video-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.3);
      transition: background 0.3s;
    }

    .video-box:hover::before {
      background: rgba(0, 0, 0, 0.1);
    }

    .play-btn {
      width: 60px;
      height: 60px;
      background: rgba(0, 210, 255, 0.85);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
      transition: transform 0.2s, background 0.2s;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
    }

    .video-box:hover .play-btn {
      transform: scale(1.1);
      background: #00d2ff;
    }

    .play-btn::after {
      content: '';
      display: block;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 10px 0 10px 18px;
      border-color: transparent transparent transparent #ffffff;
      margin-left: 4px;
    }

    /* POPUP LECTEUR GRAND ÉCRAN (MODAL) */
    .video-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .video-modal.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      width: 80%;
      max-width: 1000px;
      aspect-ratio: 16/9;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
      border-radius: 8px;
      overflow: hidden;
    }

    .modal-content iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .close-modal {
      position: absolute;
      top: -45px;
      right: 0;
      color: #ffffff;
      font-size: 2rem;
      cursor: pointer;
      font-weight: 300;
      transition: color 0.2s;
    }

    .close-modal:hover {
      color: #00d2ff;
    }

    /* SÉLECTEUR DE CLASSES (BAS) */
    .class-selector {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      width: 100%;
      overflow-x: auto;
      padding: 15px 0 25px 0;
      background: linear-gradient(to top, rgba(8, 10, 15, 0.9), transparent);
    }

    .class-btn {
      background: transparent;
      border: none;
      color: #888888;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      padding: 10px 12px;
      transition: color 0.3s, text-shadow 0.3s;
      position: relative;
      white-space: nowrap;
    }

    .class-btn:hover {
      color: #ffffff;
    }

    .class-btn.active {
      color: #ffffff;
      text-shadow: 0 0 10px #00d2ff;
    }

    .class-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 8px;
      background-color: #00d2ff;
      border-radius: 50%;
      box-shadow: 0 0 8px #00d2ff;
    }

    @media (max-width: 850px) {
      .navbar {
        padding: 0 20px;
      }
      .class-display {
        flex-direction: column;
        align-items: center;
        height: auto;
      }
      .class-content-right {
        max-width: 100%;
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <a href="aion2.html" class="nav-logo">
      <img src="images/logo.png" alt="AION 2 Logo" onerror="this.style.display='none'" />
      AION 2
    </a>
    <nav>
      <ul class="nav-links">
        <li><a href="aion2.html">Accueil</a></li>
        <li><a href="#">Actualités</a></li>
        <li><a href="Classes.html" class="active">Classes</a></li>
        <li><a href="#">Média</a></li>
        <li><a href="#">Communauté</a></li>
      </ul>
    </nav>
  </header>

  <main class="classes-container">
    <h1 class="section-title">Classes</h1>

    <div class="class-display">
      <div class="character-portrait">
        <img id="class-img" src="images/gladiateur.webp" alt="Gladiateur" />
      </div>

      <div class="class-content-right">
        <h2 class="class-name" id="class-title">Gladiateur</h2>
        
        <p class="class-description" id="class-desc">
          Un guerrier d'avant-garde qui manie une gigantesque lame et balaye ses ennemis à la manière d'une tempête.
        </p>

        <div class="video-box" id="video-preview" onclick="openVideo()">
          <div class="play-btn"></div>
        </div>
      </div>
    </div>

    <nav class="class-selector">
      <button class="class-btn active" onclick="selectClass('gladiateur', this)">Gladiateur</button>
      <button class="class-btn" onclick="selectClass('templier', this)">Templier</button>
      <button class="class-btn" onclick="selectClass('assassin', this)">Assassin</button>
      <button class="class-btn" onclick="selectClass('rodeur', this)">Rôdeur</button>
      <button class="class-btn" onclick="selectClass('aede', this)">Aède</button>
      <button class="class-btn" onclick="selectClass('clerc', this)">Clerc</button>
      <button class="class-btn" onclick="selectClass('sorcier', this)">Sorcier</button>
      <button class="class-btn" onclick="selectClass('spiritualiste', this)">Spiritualiste</button>
    </nav>
  </main>

  <div class="video-modal" id="video-modal" onclick="closeVideoOnBg(event)">
    <div class="modal-content">
      <span class="close-modal" onclick="closeVideo()">&times;</span>
      <iframe id="youtube-player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    let currentVideoId = "ndri5XpnRK4";

    const classesData = {
      gladiateur: {
        title: "Gladiateur",
        desc: "Un guerrier d'avant-garde qui manie une gigantesque lame et balaye ses ennemis à la manière d'une tempête.",
        img: "images/gladiateur.webp",
        youtubeId: "ndri5XpnRK4",
        scaleUp: false
      },
      templier: {
        title: "Templier",
        desc: "Un protecteur inébranlable utilisant bouclier et épée pour encaisser les assauts et protéger ses alliés.",
        img: "images/Templier.webp",
        youtubeId: "Zs6HnL2N5Hk",
        scaleUp: false
      },
      assassin: {
        title: "Assassin",
        desc: "Maître de la discrétion et des attaques rapides dans le dos, éliminant ses cibles avant même d'être repéré.",
        img: "images/Assassin.webp",
        youtubeId: "jUW24SLKK3I",
        scaleUp: false
      },
      rodeur: {
        title: "Rôdeur",
        desc: "Un archer d'élite capable de frapper à distance tout en posant des pièges mortels sur le terrain.",
        img: "images/Rodeur.webp",
        youtubeId: "C6INRqEqv3Y",
        scaleUp: true // Agrandissement spécifique
      },
      aede: {
        title: "Aède",
        desc: "Un combattant au bâton renforçant le groupe grâce à des mantras puissants et des soins de soutien.",
        img: "images/Chanter.webp",
        youtubeId: "rtOt3KvmYCI",
        scaleUp: true // Agrandissement spécifique
      },
      clerc: {
        title: "Clerc",
        desc: "Le pilier de soutien par excellence, capable de soigner les blessures graves et d'invoquer la fureur divine.",
        img: "images/Cleric.webp",
        youtubeId: "RU-4yiNNnY0",
        scaleUp: false
      },
      sorcier: {
        title: "Sorcier",
        desc: "Un maître des éléments déchaînant le feu et la glace pour infliger des dégâts magiques dévastateurs.",
        img: "images/Sorcerer.webp",
        youtubeId: "KoTYxGmnp7c",
        scaleUp: false
      },
      spiritualiste: {
        title: "Spiritualiste",
        desc: "Un invocateur commandant aux esprits élémentaires pour affaiblir et contrôler ses adversaires.",
        img: "images/Spiritualist.webp",
        youtubeId: "E506FH5bIio",
        scaleUp: false
      }
    };

    function updateVideoPreview(youtubeId) {
      currentVideoId = youtubeId;
      const previewBox = document.getElementById('video-preview');
      previewBox.style.backgroundImage = `url('https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg')`;
    }

    function selectClass(classKey, element) {
      if (classesData[classKey]) {
        const data = classesData[classKey];
        const imgElement = document.getElementById('class-img');

        document.getElementById('class-title').innerText = data.title;
        document.getElementById('class-desc').innerText = data.desc;
        imgElement.src = data.img;
        imgElement.alt = data.title;

        // Ajustement automatique de l'échelle pour Rôdeur et Aède
        if (data.scaleUp) {
          imgElement.classList.add('scaled-up');
        } else {
          imgElement.classList.remove('scaled-up');
        }

        updateVideoPreview(data.youtubeId);

        const buttons = document.querySelectorAll('.class-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        if (element) {
          element.classList.add('active');
        }
      }
    }

    function openVideo() {
      const modal = document.getElementById('video-modal');
      const player = document.getElementById('youtube-player');
      player.src = `https://www.youtube.com/embed/${currentVideoId}?autoplay=1&rel=0`;
      modal.classList.add('active');
    }

    function closeVideo() {
      const modal = document.getElementById('video-modal');
      const player = document.getElementById('youtube-player');
      player.src = '';
      modal.classList.remove('active');
    }

    function closeVideoOnBg(event) {
      if (event.target.id === 'video-modal') {
        closeVideo();
      }
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        closeVideo();
      }
    });

    // Initialisation
    updateVideoPreview(currentVideoId);
  </script>

</body>
</html>
