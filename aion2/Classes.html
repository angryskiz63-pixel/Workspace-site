<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AION 2 | Classes</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;700&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans', sans-serif;
      background-color: #080a0f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      /* Image de fond */
      background-image: linear-gradient(to right, rgba(8, 10, 15, 0.85), rgba(8, 10, 15, 0.4)), url('images/fondclasses.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow-x: hidden;
    }

    /* Container principal */
    .classes-container {
      width: 100%;
      max-width: 1200px;
      padding: 60px 20px;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Titre de section */
    .section-title {
      font-size: 3rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-weight: 300;
      margin-bottom: 40px;
      text-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 10px;
    }

    /* Zone de contenu de la classe active */
    .class-display {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      gap: 40px;
      margin-bottom: 60px;
    }

    .class-info {
      flex: 1;
      max-width: 450px;
    }

    .class-name {
      font-size: 2.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 12px
