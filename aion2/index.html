<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Aion 2 — Portail Communautaire & Guides Francophones</title>
  <meta name="description" content="Base de connaissances, guides, builds, actualités et codes pour Aion 2. Fansite communautaire francophone." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-main: #070b16;
      --bg-card: rgba(15, 23, 42, 0.85);
      --border-card: rgba(0, 242, 254, 0.25);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-gold: #ffb74d;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #070b16;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Aion 2 : Superposé en transparence sur le Hero */
    .aion-nav {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background: linear-gradient(180deg, rgba(7, 11, 22, 0.85) 0%, rgba(7, 11, 22, 0.4) 100%);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    
    .aion-logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      height: 100%;
      position: relative;
      width: 120px;
    }
    
    /* Logo grand format (100px) centré verticalement sur la barre (70px) */
    .aion-logo-img {
      height: 100px;
      width: auto;
      object-fit: contain;
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      transition: transform 0.3s ease;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.9));
      z-index: 10;
    }
    
    .aion-logo-img:hover {
      transform: translateY(-50%) scale(1.05);
    }
    
    .aion-menu { 
      display: flex; 
      gap: 25px; 
      list-style: none; 
      margin-left: auto;
    }
    .aion-menu a {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      transition: 0.2s;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .aion-menu a:hover { color: var(--accent-cyan); }

    /* Hero Section à 800px */
    .aion-hero {
      position: relative;
      height: 800px;
      width: 100%;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      text-align: center;
    }

    .slider-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    /* Image qui couvre tout en grand format */
    .slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center top;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    /* Boutons de navigation du Slider */
    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      background: rgba(7, 11, 22, 0.6);
      border: 1px solid var(--border-card);
      color: var(--text-main);
      font-size: 1.3rem;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
    }

    .slider-btn:hover {
      background: var(--accent-cyan);
      color: #070b16;
      box-shadow: 0 0 15px var(--accent-cyan);
    }

    .slider-btn.prev { left: 25px; }
    .slider-btn.next { right: 25px; }

    /* Overlay ajusté pour le fond à 800px */
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7,11,22,0.2) 0%, rgba(7,11,22,0.5) 65%, rgba(7,11,22,1) 100%);
      z-index: 1;
      pointer-events: none;
    }
    
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 900px;
      padding: 0 20px 90px 20px;
    }
    .hero-content h1 {
      font-family: 'Cinzel', serif;
      font-size: 3.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(to right, #ffffff, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      text-shadow: 0 4px 15px rgba(0,0,0,0.9);
    }
    .hero-content p { 
      font-size: 1.3rem; 
      color: #cbd5e1; 
      margin-bottom: 0; 
      text-shadow: 0 2px 10px rgba(0,0,0,0.9); 
    }
    
    /* Grille de raccourcis */
    .quick-links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: -40px auto 50px auto;
      padding: 0 20px;
      position: relative;
      z-index: 10;
      width: 100%;
    }
    .quick-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-card);
      padding: 24px 20px;
      border-radius: 14px;
      text-align: center;
      color: white;
      text-decoration: none;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    .quick-card:hover {
      transform: translateY(-6px);
      border-color: var(--accent-cyan);
      box-shadow: 0 10px 30px rgba(0, 242, 254, 0.3);
    }
    .quick-card i { font-size: 2rem; color: var(--accent-cyan); margin-bottom: 10px; }
    .quick-card h3 { font-size: 1.1rem; font-family: 'Cinzel', serif; }

    /* Disposition principale */
    .main-layout {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px 60px 20px;
      display: grid;
      grid-template-columns: 2.3fr 1fr;
      gap: 35px;
      width: 100%;
    }

    .section-title {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--border-card);
      padding-bottom: 10px;
    }
    .section-title a { color: var(--accent-cyan); font-size: 0.95rem; text-decoration: none; font-family: 'Outfit'; }

    /* Actualités */

      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 25px;
