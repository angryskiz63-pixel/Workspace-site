<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="images/logo-aion2bis.png" />
  <link rel="shortcut icon" type="image/png" href="images/logo-aion2bis.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Aion 2 | Calculateur de Builds - UNLEASHED</title>
  <meta name="description" content="Simulateur et calculateur de builds optimisés pour Aion 2. Créez et partagez vos configurations de classe." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-main: #070b16;
      --bg-card: rgba(15, 23, 42, 0.85);
      --border-card: rgba(0, 242, 254, 0.25);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-gold: #ffb74d;
      --accent-purple: #a855f7;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    html { scroll-behavior: smooth; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Aion 2 */
    .aion-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background: linear-gradient(180deg, rgba(7, 11, 22, 0.95) 0%, rgba(7, 11, 22, 0.7) 100%);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0 4%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .aion-logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      height: 100%;
      position: relative;
      width: 120px;
    }

    .aion-logo-img {
      height: 100px;
      width: auto;
      object-fit: contain;
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      transition: transform 0.3s ease;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.9));
      z-index: 10;
    }

    .aion-logo-img:hover { transform: translateY(-50%) scale(1.05); }

    .aion-lagofast {
      position: absolute;
      left: 32%;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 15;
    }

    .aion-lagofast-img {
      height: 52px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.5));
      transition: all 0.3s ease;
    }

    .aion-lagofast-img:hover {
      transform: scale(1.1);
      filter: drop-shadow(0 0 18px rgba(0, 242, 254, 0.9));
    }

    .aion-menu { 
      display: flex; 
      gap: 18px; 
      list-style: none; 
      margin-left: auto;
      align-items: center;
    }

    .aion-menu a {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: 0.2s;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .aion-menu a:hover, .aion-menu a.active { color: var(--accent-cyan); }

    .coming-soon-group {
      position: relative;
      display: flex;
      gap: 18px;
      align-items: center;
      padding-top: 10px;
    }

    .coming-soon-group::before {
      content: 'COMING SOON';
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.62rem;
      font-weight: 800;
      color: var(--accent-gold);
      letter-spacing: 0.1em;
      white-space: nowrap;
      text-shadow: 0 0 6px rgba(255, 183, 77, 0.6);
      pointer-events: none;
    }

    .coming-soon-group a { opacity: 0.6; cursor: not-allowed; }
    .coming-soon-group a:hover { color: var(--text-main); }

    .aion-fav-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-card);
      color: var(--accent-gold);
      padding: 7px 14px;
      border-radius: 20px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .aion-fav-btn:hover {
      background: var(--accent-gold);
      color: #070b16;
      border-color: var(--accent-gold);
      box-shadow: 0 0 12px rgba(255, 183, 77, 0.5);
    }

    .aion-discord-btn {
      background: #5865F2;
      color: #fff !important;
      padding: 8px 18px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: bold !important;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(88, 101, 242, 0.4);
      transition: all 0.2s ease !important;
    }

    .aion-discord-btn:hover {
      background: #4752C4;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(88, 101, 242, 0.6);
    }

    /* Layout Spécifique Page Build */
    .build-container {
      max-width: 1400px;
      margin: 100px auto 40px auto;
      padding: 0 20px;
      flex: 1;
      width: 100%;
    }

    .page-title {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--text-main);
      border-bottom: 2px solid var(--border-card);
      padding-bottom: 12px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .page-title i { color: var(--accent-cyan); }

    /* Footer Aion 2 */
    footer {
      margin-top: auto;
      background: rgba(7, 11, 22, 0.98);
      border-top: 1px solid var(--border-card);
      padding: 35px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    @media (max-width: 1100px) {
      .aion-lagofast { left: 22%; }
    }

    @media (max-width: 900px) {
      .aion-logo-img { height: 60px; }
      .aion-menu { display: none; }
      .aion-lagofast { display: none; }
    }
  </style>
</head>
<body>

    if (window.sidebar && window.sidebar.addPanel) {
      window.sidebar.addPanel(document.title, window.location.href, '');
    } else if (window.external && ('AddFavorite' in window.external)) {
      window.external.AddFavorite(location.href, document.title);
    } else {
      alert('Appuie sur ' + (navigator.userAgent.toLowerCase().indexOf('mac') != -1 ? 'Cmd' : 'Ctrl') + ' + D pour ajouter cette page à tes favoris.');
