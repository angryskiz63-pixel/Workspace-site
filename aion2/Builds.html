<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Planificateur de Builds - Aion 2</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    h1, h2 {
      text-align: center;
      color: #f39c12;
    }
    .class-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      max-width: 900px;
      margin: 0 auto 30px auto;
    }
    .class-btn {
      background-color: #1e1e1e;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 15px 10px;
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.2s ease;
    }
    .class-btn:hover, .class-btn.active {
      border-color: #f39c12;
      background-color: #2a2a2a;
      transform: translateY(-2px);
    }
    .class-icon {
      font-size: 24px;
      margin-bottom: 5px;
    }
    .class-name {
      font-weight: bold;
      font-size: 14px;
    }
    .class-role {
      font-size: 11px;
      color: #888;
      margin-top: 3px;
    }
    .builder-container {
      max-width: 900px;
      margin: 0 auto;
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
    }
    .skill-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }
    .ql-sk-icon {
      width: 50px;
      height: 50px;
      background-color: #2c2c2c;
      border: 1px solid #444;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .ql-sk-icon img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <h1>Planificateur de Builds</h1>
  
  <!-- Grille des 8 classes -->
  <div class="class-grid" id="classGrid">
    <button class="class-btn" data-class="gladiator" onclick="loadClassBuild('gladiator')">
      <span class="class-icon">⚔️</span>
      <span class="class-name">Gladiateur</span>
      <span class="class-role">DPS Mêlée</span>
    </button>
    <button class="class-btn" data-class="templar" onclick="loadClassBuild('templar')">
      <span class="class-icon">🛡️</span>
      <span class="class-name">Templier</span>
      <span class="class-role">Tank</span>
    </button>
    <button class="class-btn" data-class="ranger" onclick="loadClassBuild('ranger')">
      <span class="class-icon">🏹</span>
      <span class="class-name">Rôdeur</span>
      <span class="class-role">DPS Distance</span>
    </button>
    <button class="class-btn" data-class="assassin" onclick="loadClassBuild('assassin')">
      <span class="class-icon">🗡️</span>
      <span class="class-name">Assassin</span>
      <span class="class-role">DPS Furtif</span>
    </button>
    <button class="class-btn" data-class="sorcerer" onclick="loadClassBuild('sorcerer')">
      <span class="class-icon">🔮</span>
      <span class="class-name">Sorcier</span>
      <span class="class-role">DPS Magie</span>
    </button>
    <button class="class-btn" data-class="spiritmaster" onclick="loadClassBuild('spiritmaster')">
      <span class="class-icon">👻</span>
      <span class="class-name">Spiritualiste</span>
      <span class="class-role">Invocateur</span>
    </button>
    <button class="class-btn" data-class="cleric" onclick="loadClassBuild('cleric')">
      <span class="class-icon">✨</span>
      <span class="class-name">Clerc</span>
      <span class="class-role">Healer / Support</span>
    </button>
    <button class="class-btn" data-class="aoid" onclick="loadClassBuild('aoid')">
      <span class="class-icon">🎵</span>
      <span class="class-name">Aède</span>
      <span class="class-role">Buff / Support</span>
    </button>
  </div>

  <!-- Zone du Builder -->
  <div class="builder-container">
    <h2 id="selectedClassName">Sélectionnez une classe</h2>
    <div class="skill-pool" id="skillPool">
      <!-- Les sorts injectés dynamiquement apparaîtront ici -->
    </div>
  </div>

  <script>
    const AionData = {
      gladiator: {
        name: "Gladiateur",
        skills: [
          { id: "g1", name: "Onde de choc", type: "active", icon: "assets/skills/glad_shock.png", desc: "Inflige des dégâts physiques et renverse la cible." },
          { id: "g2", name: "Furie sanguinaire", type: "passive", icon: "assets/skills/glad_fury.png", desc: "Augmente l'attaque proportionnellement aux PV manquants." }
        ]
      },
      templar: {
        name: "Templier",
        skills: [
          { id: "t1", name: "Fureur divine", type: "active", icon: "assets/skills/temp_fury.png", desc: "Provoque les ennemis ciblés et génère de la menace." }
        ]
      },
      ranger: {
        name: "Rôdeur",
        skills: [
          { id: "r1", name: "Flèche perçante", type: "active", icon: "assets/skills/ranger_arrow.png", desc: "Tire une flèche puissante ignorant une partie de l'armure." }
        ]
      },
      assassin: {
        name: "Assassin",
        skills: [
          { id: "a1", name: "Frappe sombre", type: "active", icon: "assets/skills/sin_strike.png", desc: "Attaque furtive infligeant des dégâts critiques accrus dans le dos." }
        ]
      },
      sorcerer: {
        name: "Sorcier",
        skills: [
          { id: "s1", name: "Tempête de flammes", type: "active", icon: "assets/skills/sorc_fire.png", desc: "Invoque une zone de feu continue." }
        ]
      },
      spiritmaster: {
        name: "Spiritualiste",
        skills: [
          { id: "sm1", name: "Invocation d'esprit", type: "active", icon: "assets/skills/sm_spirit.png", desc: "Invoque un esprit élémentaire pour combattre à vos côtés." }
        ]
      },
      cleric: {
        name: "Clerc",
        skills: [
          { id: "c1", name: "Lumière régénératrice", type: "active", icon: "assets/skills/cleric_heal.png", desc: "Soigne les PV de la cible alliée sur la durée." }
        ]
      },
      aoid: {
        name: "Aède",
        skills: [
          { id: "ao1", name: "Mantra de célérité", type: "active", icon: "assets/skills/aoid_mantra.png", desc: "Augmente la vitesse d'attaque et de déplacement du groupe." }
        ]
      }
    };

    function loadClassBuild(classKey) {
      const currentClassData = AionData[classKey];
      if (!currentClassData) return;
      
      // Mise à jour du titre de la section
      document.getElementById("selectedClassName").innerText = `Build : ${currentClassData.name}`;

      // Gestion visuelle des boutons actifs
      document.querySelectorAll('.class-btn').forEach(btn => {
        btn.classList.remove('active');
        if(btn.getAttribute('data-class') === classKey) {
          btn.classList.add('active');
        }
      });
      
      // Injection des sorts
      const poolContainer = document.getElementById("skillPool");
      poolContainer.innerHTML = ""; 
      
      currentClassData.skills.forEach(skill => {
        const skillEl = document.createElement("div");
        skillEl.className = "ql-sk-icon";
        skillEl.innerHTML = `<img src="${skill.icon}" alt="${skill.name}" title="${skill.name} - ${skill.desc}">`;
        poolContainer.appendChild(skillEl);
      });
    }
  </script>

</body>
</html>
