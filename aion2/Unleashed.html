<script>
  const firebaseConfig = {
    databaseURL: "https://unleashed-69944-default-rtdb.europe-west1.firebasedatabase.app"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // IDs OAuth
  const TWITCH_CLIENT_ID = 'gmzt0gwom9gxnaxotky9jjn683y283'; 
  const DISCORD_CLIENT_ID = '1547252711790088214'; // Ton ID Discord
  const ADMIN_NAME = 'angryskiz'; 
  const REDIRECT_URI = window.location.origin + window.location.pathname;

  let currentIP = "";
  let joueursData = {};
  let isEditingMode = false;

  function ajouterFavoris() {
    if (window.sidebar && window.sidebar.addPanel) {
      window.sidebar.addPanel(document.title, window.location.href, '');
    } else if (window.external && ('AddFavorite' in window.external)) {
      window.external.AddFavorite(location.href, document.title);
    } else {
      alert('Appuie sur ' + (navigator.userAgent.toLowerCase().indexOf('mac') != -1 ? 'Cmd' : 'Ctrl') + ' + D pour ajouter cette page à tes favoris.');
    }
  }

  async function obtenirIP() {
    try {
      const res = await fetch('https://api.ipify.org?format=json');
      const data = await res.json();
      currentIP = data.ip;
    } catch (e) {
      currentIP = "127.0.0.1";
    }
  }

  // --- Authentification ---
  function loginTwitch() {
    const authUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${TWITCH_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=user:read:email`;
    window.location.href = authUrl;
  }

  function loginDiscord() {
    const authUrl = `https://discord.com/api/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
    window.location.href = authUrl;
  }

  function logoutSocial() {
    localStorage.removeItem('unleashed_user');
    isEditingMode = false;
    verifierSession();
  }

  window.addEventListener('DOMContentLoaded', async () => {
    await obtenirIP();
    
    const hash = window.location.hash;
    if (hash.includes('access_token')) {
      const params = new URLSearchParams(hash.substring(1));
      const token = params.get('access_token');
      
      if (hash.includes('scope=identify')) {
        recupererProfilDiscord(token);
      } else {
        recupererProfilTwitch(token);
      }
    } else {
      verifierSession();
    }

    db.ref('joueurs').on('value', (snapshot) => {
      joueursData = snapshot.val() || {};
      afficherListeJoueurs(joueursData);
      
      if (!isEditingMode) {
        verifierInscriptionExistante();
      }
    });
  });

  function recupererProfilTwitch(token) {
    fetch('https://api.twitch.tv/helix/users', {
      headers: {
        'Client-ID': TWITCH_CLIENT_ID,
        'Authorization': `Bearer ${token}`
      }
    })
    .then(res => res.json())
    .then(data => {
      if (data.data && data.data.length > 0) {
        const username = data.data[0].display_name;
        sauvegarderSession({ name: username, provider: 'Twitch' });
      }
    })
    .catch(err => console.error("Erreur Twitch OAuth:", err));
  }

  function recupererProfilDiscord(token) {
    fetch('https://discord.com/api/users/@me', {
      headers: {
        'Authorization': `Bearer ${token}`
      }
    })
    .then(res => res.json())
    .then(data => {
      if (data.username) {
        const username = data.global_name || data.username;
        sauvegarderSession({ name: username, provider: 'Discord' });
      }
    })
    .catch(err => console.error("Erreur Discord OAuth:", err));
  }

  function sauvegarderSession(userData) {
    localStorage.setItem('unleashed_user', JSON.stringify(userData));
    window.location.hash = '';
    verifierSession();
  }

  function meObtenirSession() {
    const raw = localStorage.getItem('unleashed_user');
    return raw ? JSON.parse(raw) : null;
  }

  function verifierSession() {
    const session = meObtenirSession();

    if (session && session.name.toLowerCase() === ADMIN_NAME.toLowerCase()) {
      document.getElementById('admin-panel').style.display = 'block';
    } else {
      document.getElementById('admin-panel').style.display = 'none';
    }

    if (session) {
      document.getElementById('step-login').style.display = 'none';
      document.getElementById('social-username').innerText = session.name;
      document.getElementById('social-platform').innerText = `Connecté via ${session.provider}`;
      
      const avatarContainer = document.getElementById('social-avatar');
      avatarContainer.innerText = session.name.charAt(0).toUpperCase();
      avatarContainer.style.background = session.provider === 'Twitch' ? 'var(--accent-twitch)' : 'var(--accent-discord)';

      if (!isEditingMode) {
        verifierInscriptionExistante();
      }
    } else {
      document.getElementById('step-login').style.display = 'block';
      document.getElementById('step-form').style.display = 'none';
      document.getElementById('step-confirmed').style.display = 'none';
    }
  }

  function verifierInscriptionExistante() {
    const session = meObtenirSession();
    if (!session) return;

    let joueurExiste = null;
    for (const key in joueursData) {
      if (joueursData[key].account && joueursData[key].account.toLowerCase() === session.name.toLowerCase()) {
        joueurExiste = joueursData[key];
        break;
      }
    }

    if (joueurExiste && !isEditingMode) {
      document.getElementById('step-form').style.display = 'none';
      document.getElementById('step-confirmed').style.display = 'block';
      document.getElementById('summary-text').innerHTML = `
        ${joueurExiste.provider || 'Compte'} : <strong>${joueurExiste.account}</strong><br>
        Perso : <strong>${joueurExiste.character}</strong> (${joueurExiste.class})
      `;
    } else if (!isEditingMode) {
      document.getElementById('step-form').style.display = 'block';
      document.getElementById('step-confirmed').style.display = 'none';
      document.getElementById('btn-submit-text').innerHTML = `<i class="fas fa-check-circle"></i> Confirmer ma place`;
    }
  }

  function activerModification() {
    const session = meObtenirSession();
    if (!session) return;

    let joueurExiste = null;
    for (const key in joueursData) {
      if (joueursData[key].account && joueursData[key].account.toLowerCase() === session.name.toLowerCase()) {
        joueurExiste = joueursData[key];
        break;
      }
    }

    if (joueurExiste) {
      isEditingMode = true;
      document.getElementById('char-name').value = joueurExiste.character || '';
      document.getElementById('char-class').value = joueurExiste.class || '';
      document.getElementById('btn-submit-text').innerHTML = `<i class="fas fa-save"></i> Enregistrer les modifications`;

      document.getElementById('step-confirmed').style.display = 'none';
      document.getElementById('step-form').style.display = 'block';
    }
  }

  async function envoyerReservation(e) {
    e.preventDefault();
    const session = meObtenirSession();
    const charName = document.getElementById('char-name').value.trim();
    const charClass = document.getElementById('char-class').value;

    if (!session) return;

    let existingKey = null;
    for (const key in joueursData) {
      if (joueursData[key].account && joueursData[key].account.toLowerCase() === session.name.toLowerCase()) {
        existingKey = key;
        break;
      }
    }

    const newReservation = {
      account: session.name,
      provider: session.provider,
      character: charName,
      class: charClass,
      ip: currentIP,
      date: new Date().toLocaleDateString('fr-FR')
    };

    if (existingKey) {
      db.ref('joueurs/' + existingKey).set(newReservation);
    } else {
      db.ref('joueurs').push(newReservation);
    }

    publierDiscord(newReservation);

    isEditingMode = false;
    document.getElementById('step-form').style.display = 'none';
    document.getElementById('step-confirmed').style.display = 'block';
    document.getElementById('summary-text').innerHTML = `
      ${newReservation.provider} : <strong>${newReservation.account}</strong><br>
      Perso : <strong>${newReservation.character}</strong> (${newReservation.class})
    `;
  }

  function ajouterPoteAdmin(e) {
    e.preventDefault();
    const accountName = document.getElementById('admin-tw').value.trim();
    const charName = document.getElementById('admin-char').value.trim();
    const charClass = document.getElementById('admin-class').value;

    let existingKey = null;
    for (const key in joueursData) {
      if (joueursData[key].account && joueursData[key].account.toLowerCase() === accountName.toLowerCase()) {
        existingKey = key;
        break;
      }
    }

    const newReservation = {
      account: accountName,
      provider: 'Manuel',
      character: charName,
      class: charClass,
      ip: "Ajout-Admin",
      date: new Date().toLocaleDateString('fr-FR')
    };

    if (existingKey) {
      db.ref('joueurs/' + existingKey).set(newReservation);
    } else {
      db.ref('joueurs').push(newReservation);
    }

    publierDiscord(newReservation);

    document.getElementById('admin-tw').value = '';
    document.getElementById('admin-char').value = '';
  }

  function supprimerJoueur(key) {
    if (confirm("Supprimer ce membre définitivement ?")) {
      db.ref('joueurs/' + key).remove();
    }
  }

  async function publierDiscord(reservation) {
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1547233701551808512/OzUsbQfnH1yxAGRL97UgT07MIDtMOuoDa-9R-tf2gUIygdwrMk5srKo44Lw292nrJ6GB";

    if (DISCORD_WEBHOOK_URL && DISCORD_WEBHOOK_URL.startsWith("https://discord")) {
      try {
        await fetch(DISCORD_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: "Bot UNLEASHED",
            avatar_url: "https://angryskiz.fr/aion2/images/logo-aion2bis.png",
            embeds: [{
              title: "⚔️ Inscription / Modification — Guilde UNLEASHED !",
              color: reservation.provider === 'Discord' ? 5793266 : 9520895,
              fields: [
                { name: `Compte (${reservation.provider || 'Twitch'})`, value: reservation.account, inline: true },
                { name: "Nom Personnage", value: reservation.character, inline: true },
                { name: "Classe prévue", value: reservation.class, inline: true },
                { name: "Adresse IP", value: reservation.ip || "Non détectée", inline: false }
              ],
              footer: { text: "Portail Aion 2 — UNLEASHED" },
              timestamp: new Date()
            }]
          })
        });
      } catch (err) {
        console.error("Erreur Discord Webhook :", err);
      }
    }
  }

  function afficherListeJoueurs(data) {
    const container = document.getElementById('players-list-container');
    const counter = document.getElementById('player-count');
    const session = meObtenirSession();
    const isAdmin = session && session.name.toLowerCase() === ADMIN_NAME.toLowerCase();

    if (!data || Object.keys(data).length === 0) {
      counter.innerText = "0";
      container.innerHTML = `<p style="text-align:center; font-size:0.8rem; color:var(--text-muted); padding:10px;">Aucun inscrit pour le moment.</p>`;
      return;
    }

    const keys = Object.keys(data);
    counter.innerText = keys.length;

    container.innerHTML = keys.map(key => {
      const p = data[key];
      const accountDisplay = p.account || p.twitch || 'Anonyme';
      return `
        <div class="player-row">
          <div>
            <span class="char">${p.character}</span>
            <span style="font-size:0.75rem; color:var(--text-muted);">(${accountDisplay})</span>
          </div>
          <div>
            <span class="class-badge">${p.class}</span>
            ${isAdmin ? `<button onclick="supprimerJoueur('${key}')" class="delete-btn" title="Supprimer">X</button>` : ''}
          </div>
        </div>
      `;
    }).join('');
  }
</script>
