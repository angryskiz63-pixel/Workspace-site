<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Angryskiz — Hub Officiel</title>
  <meta name="description" content="Hub officiel Angryskiz : Portail Aion 2, Live Streaming Twitch et services SkizTech." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(15, 23, 42, 0.75);
      --accent-aion: #00f2fe;
      --accent-stream: #9146FF;
      --accent-tech: #ff3366;
      --accent-linktree: #43E660;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background-image: radial-gradient(circle at 50% 20%, rgba(145, 70, 255, 0.12), transparent 40%),
                        radial-gradient(circle at 80% 80%, rgba(0, 242, 254, 0.08), transparent 40%);
      overflow-x: hidden;
      position: relative;
    }

    /* CANVAS DE FOND ANIMÉ */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* HEADER EN-TÊTE */
    header {
      width: 100%;
      padding: 30px 20px 10px 20px;
      text-align: center;
      z-index: 10;
    }

    .brand-title {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
      text-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .brand-subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 400;
    }

    /* RESEAUX SOCIAUX EN HAUT */
    .social-bar {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 15px;
    }

    .social-bar a {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 1.2rem;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .social-bar a:hover {
      transform: translateY(-3px);
      background: var(--text-main);
      color: var(--bg-dark);
      box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
    }

    /* GRILLE DES UNIVERS */
    .hub-container {
      width: 100%;
      max-width: 1300px;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      margin: auto 0;
      z-index: 10;
    }

    .hub-card {
      height: 480px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 30px;
      text-decoration: none;
      backdrop-filter: blur(4px);
      transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    footer {
      width: 100%;
      padding: 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- CANVAS ARRIÈRE-PLAN ANIMÉ -->
  <canvas id="bg-canvas"></canvas>

  <header>
    <h1 class="brand-title">Angryskiz</h1>
    <p class="brand-subtitle">Créateur de contenu & Expertise High-Tech</p>
  </header>

  <main class="hub-container">
    <!-- PORTE 1 : AION 2 -->
    <a href="/aion2/aion2.html" class="hub-card card-aion">
      <div class="card-content">
        <span class="badge badge-aion">Communauté</span>
        <h2 class="card-title">Portail Aion 2</h2>
      </div>
    </a>

    <!-- PORTE 2 : STREAMING & TWITCH -->
    <a href="https://twitch.tv/angryskiz" target="_blank" class="hub-card card-stream">
      <div class="card-content">
        <span class="badge badge-stream"><i class="fas fa-circle" style="font-size:0.6rem; vertical-align:middle;"></i> Live Stream</span>
        <h2 class="card-title">Twitch</h2>
      </div>
    </a>

    <!-- PORTE 3 : SKIZTECH -->
    <a href="#skiztech" class="hub-card card-tech">
      <div class="card-content">
        <span class="badge badge-tech">Service Pro</span>
        <h2 class="card-title">SkizTech</h2>
      </div>
    </a>
  </main>

  <footer>
    <p>Angryskiz | Skiztech by Skizcorp © 2026 — Tous droits réservés</p>
  </footer>

  <!-- LECTEUR TWITCH FLOTTANT EN BAS À DROITE -->
  <div id="twitch-widget"></div>

  <!-- SCRIPT DU PLAYER TWITCH -->
  <script src="js/player.js?v=2"></script>

  <!-- SCRIPT DU CANVAS ANIMÉ (PARTICULES & NÉONS) -->
  <script>
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const particles = [];
    const particleCount = 70;

    for (let i = 0; i < particleCount; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2 + 0.5,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        color: Math.random() > 0.5 ? '#9146FF' : '#00f2fe'
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#090d16');
      grad.addColorStop(1, '#04060a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < particleCount; i++) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.fill();

        for (let j = i + 1; j < particleCount; j++) {
          let p2 = particles[j];
          let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
          if (dist < 130) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = p.color;
            ctx.globalAlpha = (1 - dist / 130) * 0.2;
            ctx.lineWidth = 0.6;
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
        }
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>

</body>
</html>
