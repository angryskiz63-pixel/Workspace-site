<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>AngrySkiz | SkizTech</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg: #050507;
      --red: #ff3e3e;
      --mag: #9d4edd;
      --twitch: #9146FF;
      --youtube: #FF0000;
      --instagram: #E1306C;
      --tiktok: #010101;
      --aion-cyan: #00f2fe;
    }
    body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; overflow: hidden; }

    .container { display: flex; height: 100vh; position: relative; }
    
    .divider {
      position: absolute; left: 50%; top: 0; bottom: 0; width: 2px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.4), transparent);
      box-shadow: 0 0 20px rgba(255,255,255,0.3);
      z-index: 10;
    }

    .side { 
      flex: 1; display: flex; align-items: center; justify-content: center;
      transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      position: relative; overflow: hidden;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      padding-bottom: 80px;
    }
    .side:hover { flex: 1.2; }

    .side::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.3);
      transition: background 0.5s; z-index: 1;
    }
    .side:hover::before { background: rgba(0, 0, 0, 0.1); }

    .card { padding: 40px; text-align: center; z-index: 2; transition: transform 0.3s; width: 100%; max-width: 500px; }
    .side:hover .card { transform: scale(1.02); }

    /* BLOC 16:9 AVEC IMAGES/FOND-AION2BIS.JPG */
    .aion2-card-banner {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-image: linear-gradient(180deg, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.65) 100%), url('images/fond-aion2bis.jpg');
      background-size: cover;
      background-position: center;
      border-radius: 12px;
      border: 2px solid rgba(0, 242, 254, 0.8);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.45);
      margin-top: 15px;
      margin-bottom: 25px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 18px;
      text-decoration: none;
      transition: all 0.4s ease;
      animation: pulseAionCard 3s infinite alternate;
    }

    .aion2-card-banner:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: #00f2fe;
      box-shadow: 0 0 40px rgba(0, 242, 254, 0.85);
    }

    .aion2-title-text {
      font-weight: 900;
      font-size: 1.4rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(0, 242, 254, 1), 0 0 20px rgba(0, 242, 254, 0.8), 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    .aion2-badge {
      position: absolute;
      top: 10px;
      right: 12px;
      background: #ff0055;
      color: white;
      font-size: 0.65rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: 0 0 10px #ff0055;
    }

    @keyframes pulseAionCard {
      0% { box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }
      100% { box-shadow: 0 0 30px rgba(0, 242, 254, 0.7); }
    }

    .twitch-embed-container {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(145, 70, 255, 0.5);
      box-shadow: 0 0 20px rgba(145, 70, 255, 0.3);
      aspect-ratio: 16 / 9;
    }

    .content-right { margin-top: -100px; } 

    p { font-size: 1.1rem; opacity: 0.9; line-height: 1.6; max-width: 400px; margin: 0 auto 2rem; text-shadow: 0 2px 8px rgba(0,0,0,0.8); text-transform: uppercase; letter-spacing: 0.5px; }
    
    .btn {
      padding: 18px 45px; 
      margin-top: 50px;
      font-size: 1.1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      border: 2px solid #ffffff;
      border-radius: 0px;
      background: #000000;
      color: #ffffff;
      cursor: pointer;
      transition: all 0.4s ease;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover { 
      background: #ffffff;
      color: #000000;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      transform: translateY(-5px);
    }

    .stream-platforms { display: flex; gap: 20px; justify-content: center; align-items: center; margin-bottom: 25px; margin-top: 10px;}

    .platform-link {
      position: relative; display: flex; align-items: center; justify-content: center;
      width: 60px; height: 60px; border-radius: 50px; background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 1.6rem;
      text-decoration: none; transition: all 0.3s ease; backdrop-filter: blur(5px);
    }

    .platform-link:hover { transform: translateY(-5px); color: #fff; }
    .twitch:hover { background: var(--twitch); border-color: var(--twitch); box-shadow: 0 0 15px rgba(145, 70, 255, 0.5); }
    .tiktok:hover { background: #fff; color: #000; border-color: #fff; box-shadow: 0 0 15px rgba(255, 255, 255, 0.5); }
    .youtube:hover { background: var(--youtube); border-color: var(--youtube); box-shadow: 0 0 15px rgba(255, 0, 0, 0.5); }
    .instagram:hover { background: var(--instagram); border-color: var(--instagram); box-shadow: 0 0 15px rgba(225, 48, 108, 0.5); }

    .live-badge {
      position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
      background: #ff3e3e; color: white; font-size: 0.65rem; font-weight: 800;
      padding: 2px 6px; border-radius: 10px; box-shadow: 0 0 8px rgba(255, 62, 62, 0.8);
      animation: pulse 1.5s infinite; z-index: 5; display: none; 
    }

    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

    .side-left { background-image: url('images/fond-gauche.jpg'); }
    .side-right { background-image: url('images/fond-droit.jpg'); }

    .footer-banner {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 60px;
      background: rgba(5, 5, 7, 0.8); backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.1); z-index: 20;
      display: flex; justify-content: center; align-items: center;
      font-size: 0.95rem; letter-spacing: 1px; color: rgba(255, 255, 255, 0.6);
    }
    .footer-brand { color: #00bcd4; font-weight: bold; }

    @media (max-width: 768px) { 
      body, html { overflow: auto; }
      .container { flex-direction: column; height: auto; } 
      .divider { display: none; } 
      .side { padding-bottom: 60px; }
      .content-right { margin-top: 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="divider"></div>

    <section class="side side-left">
      <div class="card">

        <div class="stream-platforms">
          <a href="https://www.twitch.tv/Angryskiz" target="_blank" class="platform-link twitch" title="Regarder sur Twitch">
            <div id="twitch-badge" class="live-badge">LIVE</div>
            <i class="fa-brands fa-twitch"></i>
          </a>
          <a href="https://tiktok.com/@Angryskiz" target="_blank" class="platform-link tiktok" title="Suivre sur TikTok"><i class="fa-brands fa-tiktok"></i></a>
          <a href="https://www.youtube.com/@angryskiz" target="_blank" class="platform-link youtube" title="S'abonner sur YouTube"><i class="fa-brands fa-youtube"></i></a>
          <a href="https://instagram.com/angryskiz" target="_blank" class="platform-link instagram" title="Suivre sur Instagram"><i class="fa-brands fa-instagram"></i></a>
        </div>

        <a href="aion2/index.html" class="aion2-card-banner">
          <span class="aion2-badge">NOUVEAU</span>
          <span class="aion2-title-text">PORTAIL AION 2</span>
        </a>

        <div class="twitch-embed-container">
          <iframe
            src="https://player.twitch.tv/?channel=angryskiz&parent=angryskiz.fr&parent=www.angryskiz.fr"
            height="100%"
            width="100%"
            allowfullscreen>
          </iframe>
        </div>
      </div>
    </section>

    <section class="side side-right">
      <div class="card content-right">
        <p>Expertise PC, Montage, et Maintenance Informatique.</p>
        <a href="skiztech/index.html" class="btn">VOIR LES SERVICES</a>
      </div>
    </section>

    <footer class="footer-banner">
      <div class="footer-content">
        Angryskiz | Skiztech by <span class="footer-brand">Skizcorp</span> © 2026 — Tous droits réservés
      </div>
    </footer>
  </div>

  <script>
    async function checkTwitchLive() {
      const username = 'angryskiz'; 
      const badge = document.getElementById('twitch-badge');
      try {
        const response = await fetch(`https://api.twitchinsights.net/v1/user/status/${username}`);
        if (response.ok) {
          const data = await response.json();
          badge.style.display = (data.live === true) ? 'block' : 'none';
        }
      } catch (error) {
        console.log("Erreur de détection du live Twitch:", error);
      }
    }
    checkTwitchLive();
    setInterval(checkTwitchLive, 120000);
  </script>
</body>
</html>
