<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="images/logo-angryskiz.png" />
  <link rel="shortcut icon" href="images/logo-angryskiz.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Angryskiz — Hub Officiel</title>
  <meta name="description" content="Hub officiel Angryskiz : Live Streaming Twitch et services SkizTech." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(15, 23, 42, 0.75);
      --accent-stream: #9146FF;
      --accent-tech: #ff3366;
      --accent-linktree: #43E660;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* CANVAS DE FOND ANIMÉ */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* HEADER EN-TÊTE */
    header {
      width: 100%;
      padding: 30px 20px 10px 20px;
      text-align: center;
      z-index: 10;
    }

    .brand-title {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
      text-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .brand-subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 400;
    }

    /* RESEAUX SOCIAUX EN HAUT */
    .social-bar {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 15px;
    }

    .social-bar a {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 1.2rem;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .social-bar a:hover {
      transform: translateY(-3px);
      background: var(--text-main);
      color: var(--bg-dark);
      box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
    }

    /* STYLE SPECIFIQUE LINKTREE IMAGE */
    .social-bar a.linktree-btn img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      filter: brightness(0) invert(1);
      transition: filter 0.3s ease;
    }

    .social-bar a.linktree-btn:hover {
      background: var(--accent-linktree);
      box-shadow: 0 5px 15px rgba(67, 230, 96, 0.4);
    }

    .social-bar a.linktree-btn:hover img {
      filter: brightness(0);
    }

    /* GRILLE DES 2 UNIVERS CENTRÉE */
    .hub-container {
      width: 100%;
      max-width: 900px;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
      margin: auto 0;
      z-index: 10;
    }

    .card-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      justify-content: flex-end;
    }

    .hub-card {
      position: relative;
      height: 480px;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 30px;
      text-decoration: none;
      backdrop-filter: blur(4px);
      transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    .hub-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(9, 13, 22, 0.2) 0%, rgba(9, 13, 22, 0.95) 85%);
      transition: background 0.3s ease;
      z-index: 1;
    }

    .hub-card:hover {
      transform: translateY(-8px);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .hub-card:hover::before {
      background: linear-gradient(180deg, rgba(9, 13, 22, 0.1) 0%, rgba(9, 13, 22, 0.9) 85%);
    }

    /* CARTE FOND SPÉCIFIQUE */
    .card-stream {
